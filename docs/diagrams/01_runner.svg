<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1223" width="1000" height="1223" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 1: runner, vân tay và checkpoint theo stage</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="1223" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 1: runner, vân tay và checkpoint theo stage</text>
<text x="500.0" y="50" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#6a7a8a">vi_corpus/pipeline/runner.py · scripts/run_pipeline.py</text>
<rect x="30" y="70" width="600" height="106" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="42" y="92" font-size="14" font-weight="700" fill="#1b2733">scripts/run_pipeline.py</text>
<text x="42" y="109.5" font-size="12" fill="#1b2733" xml:space="preserve">--data-root, --total, --mix, --take-all, --shard I/N, --seed, --run-name</text>
<text x="42" y="126.0" font-size="12" fill="#1b2733" xml:space="preserve">--until, --force-from, --keep-stale, --executor, --num-gpus</text>
<text x="42" y="142.5" font-size="12" fill="#1b2733" xml:space="preserve">--tokenizer, --lang-model, --embedder, --perplexity-model, --hyphen-lm-model,</text>
<text x="42" y="159.0" font-size="12" fill="#1b2733" xml:space="preserve">--global-verdict, --no-dedup-index</text>
<rect x="30" y="190" width="600" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="212" font-size="14" font-weight="700" fill="#1b2733">Chuẩn bị run_dir</text>
<text x="42" y="229.5" font-size="12" fill="#1b2733" xml:space="preserve">&lt;data-root&gt;/processed/pipeline_runs/&lt;tên lần chạy&gt;/; --force-from xoá kết quả từ</text>
<text x="42" y="246.0" font-size="12" fill="#1b2733" xml:space="preserve">stage đó trở đi (kể cả clean, KU, report).</text>
<rect x="30" y="270" width="600" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="292" font-size="14" font-weight="700" fill="#1b2733">Tính vân tay mong đợi của từng stage</text>
<text x="42" y="309.5" font-size="12" fill="#1b2733" xml:space="preserve">băm(tham số stage + phiên bản code + vân tay stage trước); ingest dùng danh sách</text>
<text x="42" y="326.0" font-size="12" fill="#1b2733" xml:space="preserve">file đầu vào + kích thước. Mỗi stage chỉ băm các trường hồ sơ nguồn nó đọc, nên</text>
<text x="42" y="342.5" font-size="12" fill="#1b2733" xml:space="preserve">chỉnh ngưỡng quality chỉ chạy lại từ quality.</text>
<rect x="30" y="380" width="600" height="56" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="402" font-size="14" font-weight="700" fill="#1b2733">Vân tay trong manifest khớp?</text>
<text x="42" y="419.5" font-size="12" fill="#1b2733" xml:space="preserve">so từng stage đã có file kết quả</text>
<rect x="670" y="380" width="300" height="106" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.6"/>
<text x="682" y="402" font-size="14" font-weight="700" fill="#1b2733">Lệch</text>
<text x="682" y="419.5" font-size="12" fill="#1b2733" xml:space="preserve">xoá kết quả stage đó và mọi stage sau</text>
<text x="682" y="436.0" font-size="12" fill="#1b2733" xml:space="preserve">rồi chạy lại; --keep-stale chỉ cảnh báo</text>
<text x="682" y="452.5" font-size="12" fill="#1b2733" xml:space="preserve">và dùng kết quả cũ; run cũ chưa có vân</text>
<text x="682" y="469.0" font-size="12" fill="#1b2733" xml:space="preserve">tay: cảnh báo một lần.</text>
<polyline points="330.0,176.0 330.0,190.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="330.0,263.0 330.0,270.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="330.0,359.5 330.0,380.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="630.0,408.2 650.0,408.2 650.0,433.0 670.0,433.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="622.2" y="391.2" width="31.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="640.0" y="402.2" text-anchor="middle" font-size="11.5" fill="#455566">lệch</text>
<rect x="30" y="470" width="600" height="56" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="492" font-size="14" font-weight="700" fill="#1b2733">Với từng stage ingest → prepare → language → quality → dedup</text>
<text x="42" y="509.5" font-size="12" fill="#1b2733" xml:space="preserve">đã có file kết quả (và vân tay khớp)?</text>
<polyline points="330.0,436.5 330.0,470.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="334.0" y="442.2" width="31.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="336.0" y="453.2" text-anchor="start" font-size="11.5" fill="#455566">khớp</text>
<rect x="30" y="560" width="290" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="582" font-size="14" font-weight="700" fill="#1b2733">Đã có</text>
<text x="42" y="599.5" font-size="12" fill="#1b2733" xml:space="preserve">đọc lại Parquet, bỏ qua. Chạy lại đúng</text>
<text x="42" y="616.0" font-size="12" fill="#1b2733" xml:space="preserve">lệnh cũ = làm tiếp từ stage còn thiếu.</text>
<rect x="340" y="560" width="290" height="122" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="352" y="582" font-size="14" font-weight="700" fill="#1b2733">Chưa có: chạy hàm stage</text>
<text x="352" y="599.5" font-size="12" fill="#1b2733" xml:space="preserve">ghi vân tay TRƯỚC, rồi ghi Parquet</text>
<text x="352" y="616.0" font-size="12" fill="#1b2733" xml:space="preserve">nguyên tử; manifest += rows, seconds,</text>
<text x="352" y="632.5" font-size="12" fill="#1b2733" xml:space="preserve">peak_rss_mb, thống kê. Toàn bộ</text>
<text x="352" y="649.0" font-size="12" fill="#1b2733" xml:space="preserve">list[dict] nằm trong RAM giữa các</text>
<text x="352" y="665.5" font-size="12" fill="#1b2733" xml:space="preserve">stage.</text>
<polyline points="175.0,526.5 175.0,560.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="179.0" y="532.2" width="18.8" height="15" fill="#ffffff" opacity="0.9"/>
<text x="181.0" y="543.2" text-anchor="start" font-size="11.5" fill="#455566">có</text>
<polyline points="485.0,526.5 485.0,560.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="489.0" y="532.2" width="31.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="491.0" y="543.2" text-anchor="start" font-size="11.5" fill="#455566">chưa</text>
<rect x="670" y="560" width="300" height="90" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="682" y="582" font-size="14" font-weight="700" fill="#1b2733">CuratorBackend (tuỳ chọn)</text>
<text x="682" y="599.5" font-size="12" fill="#1b2733" xml:space="preserve">language, quality, embed chạy song song</text>
<text x="682" y="616.0" font-size="12" fill="#1b2733" xml:space="preserve">khi có --executor (sơ đồ 09); không có</text>
<text x="682" y="632.5" font-size="12" fill="#1b2733" xml:space="preserve">thì chạy tuần tự trong tiến trình này.</text>
<polyline points="630.0,621.2 650.0,621.2 650.0,604.8 670.0,604.8" fill="none" stroke="#455566" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="30" y="700" width="600" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="722" font-size="14" font-weight="700" fill="#1b2733">Sau dedup: kho dấu vân tay vòng 1 (D-09)</text>
<text x="42" y="739.5" font-size="12" fill="#1b2733" xml:space="preserve">ghi state/dedup_index/&lt;nguồn&gt;/&lt;run&gt;.parquet cho mọi văn bản của lần chạy (bản bị</text>
<text x="42" y="756.0" font-size="12" fill="#1b2733" xml:space="preserve">loại ghi thành bia mộ); kho gắn với vân tay của 05_dedup.parquet, lệch thì ghi</text>
<text x="42" y="772.5" font-size="12" fill="#1b2733" xml:space="preserve">lại, --no-dedup-index thì xoá.</text>
<polyline points="175.0,633.0 175.0,700.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="485.0,682.5 485.0,700.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="810" width="600" height="56" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="832" font-size="14" font-weight="700" fill="#1b2733">Đã tới stage --until?</text>
<text x="42" y="849.5" font-size="12" fill="#1b2733" xml:space="preserve">chạy từng bước: until=ingest, rồi prepare, ...</text>
<rect x="670" y="810" width="300" height="56" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.6"/>
<text x="682" y="832" font-size="14" font-weight="700" fill="#1b2733">Dừng</text>
<text x="682" y="849.5" font-size="12" fill="#1b2733" xml:space="preserve">trả manifest của các stage đã chạy</text>
<polyline points="330.0,789.5 330.0,810.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="630.0,838.2 670.0,838.2" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="638.6" y="821.2" width="18.8" height="15" fill="#ffffff" opacity="0.9"/>
<text x="650.0" y="832.2" text-anchor="middle" font-size="11.5" fill="#455566">có</text>
<rect x="30" y="900" width="600" height="56" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="922" font-size="14" font-weight="700" fill="#1b2733">embed → reduce (nếu --embedder khác none)</text>
<text x="620" y="920" text-anchor="end" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#455566">06, 07</text>
<text x="42" y="939.5" font-size="12" fill="#1b2733" xml:space="preserve">mỗi stage một file kết quả, cùng cơ chế vân tay; --embed-scope all | kept.</text>
<polyline points="330.0,866.5 330.0,900.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="334.0" y="872.2" width="31.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="336.0" y="883.2" text-anchor="start" font-size="11.5" fill="#455566">chưa</text>
<rect x="30" y="985" width="600" height="56" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="1007" font-size="14" font-weight="700" fill="#1b2733">finalize: luôn chạy lại (rẻ, không có vân tay)</text>
<text x="42" y="1024.5" font-size="12" fill="#1b2733" xml:space="preserve">xoá kết quả finalize cũ rồi ghi lại; áp --global-verdict nếu có.</text>
<polyline points="330.0,956.5 330.0,985.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="1070" width="600" height="90" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="1092" font-size="14" font-weight="700" fill="#1b2733">Kết quả trong run_dir</text>
<text x="42" y="1109.5" font-size="12" fill="#1b2733" xml:space="preserve">01_ingest … 05_dedup (.parquet); 06_embeddings, 07_reduced nếu bật embed</text>
<text x="42" y="1126.0" font-size="12" fill="#1b2733" xml:space="preserve">clean.parquet, knowledge_units.parquet, cpt_segments.parquet, audit.json,</text>
<text x="42" y="1142.5" font-size="12" fill="#1b2733" xml:space="preserve">manifest.json, report.html</text>
<polyline points="330.0,1041.5 330.0,1070.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="1187" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="1198" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text>
<rect x="187" y="1187" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="211" y="1198" font-size="11.5" fill="#455566">bước xử lý (CPU)</text>
<rect x="337" y="1187" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="361" y="1198" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text>
<rect x="513" y="1187" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="537" y="1198" font-size="11.5" fill="#455566">loại / dừng</text>
<rect x="632" y="1187" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="656" y="1198" font-size="11.5" fill="#455566">đầu ra</text>
</svg>
