<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 804" width="1000" height="804" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 1: runner và checkpoint theo stage</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="804" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 1: runner và checkpoint theo stage</text>
<text x="500.0" y="58" text-anchor="middle" font-size="12" fill="#52514e">vi_corpus/pipeline/runner.py · scripts/run_pipeline.py</text>
<rect x="30" y="84" width="530" height="68" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="42" y="106" font-size="14" font-weight="700" fill="#1b2733">scripts/run_pipeline.py</text>
<text x="42" y="126" font-size="12" fill="#1b2733" xml:space="preserve">--data-root, --total, --mix (scale_mix quy trọng số về đúng --total), --seed</text>
<text x="42" y="143" font-size="12" fill="#1b2733" xml:space="preserve">--force-from, --until, --executor/--num-gpus, --embedder, --tokenizer</text>
<line x1="295.0" y1="152" x2="295.0" y2="190" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="192" width="530" height="85" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="214" font-size="14" font-weight="700" fill="#1b2733">Chuẩn bị run_dir</text>
<text x="42" y="234" font-size="12" fill="#1b2733" xml:space="preserve">&lt;data-root&gt;/processed/pipeline_runs/&lt;name&gt;/</text>
<text x="42" y="251" font-size="12" fill="#1b2733" xml:space="preserve">force_from: xoá file kết quả từ stage đó trở đi (kể cả clean/KU/report)</text>
<text x="42" y="268" font-size="12" fill="#1b2733" xml:space="preserve">tạo hàm đếm token: make_token_counter(cfg.tokenizer)</text>
<rect x="680" y="192" width="290" height="51" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.5"/>
<text x="692" y="214" font-size="14" font-weight="700" fill="#1b2733">ValueError</text>
<text x="692" y="234" font-size="12" fill="#1b2733" xml:space="preserve">force_from / until không thuộc STAGES</text>
<line x1="560" y1="212" x2="678" y2="212" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="206" text-anchor="middle" font-size="11.5" fill="#455566">tên sai</text>
<line x1="295.0" y1="277" x2="295.0" y2="315" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="317" width="530" height="51" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.5"/>
<text x="42" y="339" font-size="14" font-weight="700" fill="#1b2733">Với từng stage: đã có file kết quả?</text>
<text x="42" y="359" font-size="12" fill="#1b2733" xml:space="preserve">STAGES = ingest, prepare, language, quality, dedup, embed, reduce, finalize</text>
<rect x="680" y="317" width="290" height="68" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="692" y="339" font-size="14" font-weight="700" fill="#1b2733">Đọc lại Parquet, bỏ qua</text>
<text x="692" y="359" font-size="12" fill="#1b2733" xml:space="preserve">chạy lại đúng lệnh cũ = làm tiếp từ</text>
<text x="692" y="376" font-size="12" fill="#1b2733" xml:space="preserve">  stage còn thiếu</text>
<line x1="560" y1="337" x2="678" y2="337" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="331" text-anchor="middle" font-size="11.5" fill="#455566">có</text>
<line x1="295.0" y1="368" x2="295.0" y2="423" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="303.0" y="400.5" font-size="11.5" fill="#455566">chưa có</text>
<rect x="30" y="425" width="530" height="85" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="447" font-size="14" font-weight="700" fill="#1b2733">Chạy hàm stage</text>
<text x="42" y="467" font-size="12" fill="#1b2733" xml:space="preserve">rows, stats = fn(); ghi Parquet nguyên tử (io.write_rows, lô 500 dòng)</text>
<text x="42" y="484" font-size="12" fill="#1b2733" xml:space="preserve">manifest.json += {rows, seconds, thống kê stage}</text>
<text x="42" y="501" font-size="12" fill="#1b2733" xml:space="preserve">toàn bộ list[dict] nằm trong RAM giữa các stage</text>
<rect x="680" y="425" width="290" height="85" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="692" y="447" font-size="14" font-weight="700" fill="#1b2733">CuratorBackend (tùy chọn)</text>
<text x="692" y="467" font-size="12" fill="#1b2733" xml:space="preserve">language / quality / embed hf chạy</text>
<text x="692" y="484" font-size="12" fill="#1b2733" xml:space="preserve">  song song</text>
<text x="692" y="501" font-size="12" fill="#1b2733" xml:space="preserve">xem sơ đồ 09_curator</text>
<line x1="560" y1="445" x2="678" y2="445" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="439" text-anchor="middle" font-size="11.5" fill="#455566">--executor</text>
<line x1="295.0" y1="510" x2="295.0" y2="548" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="550" width="530" height="51" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.5"/>
<text x="42" y="572" font-size="14" font-weight="700" fill="#1b2733">Đã tới stage --until?</text>
<text x="42" y="592" font-size="12" fill="#1b2733" xml:space="preserve">chạy từng bước: until=ingest, rồi prepare, ...</text>
<rect x="680" y="550" width="290" height="28" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="692" y="572" font-size="14" font-weight="700" fill="#1b2733">Trả manifest, dừng</text>
<line x1="560" y1="570" x2="678" y2="570" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="564" text-anchor="middle" font-size="11.5" fill="#455566">có</text>
<line x1="295.0" y1="601" x2="295.0" y2="639" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="303.0" y="625.0" font-size="11.5" fill="#455566">không</text>
<rect x="30" y="641" width="530" height="85" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="42" y="663" font-size="14" font-weight="700" fill="#1b2733">Kết quả trong run_dir</text>
<text x="42" y="683" font-size="12" fill="#1b2733" xml:space="preserve">01_ingest, 02_prepare, 03_language, 04_quality, 05_dedup (.parquet)</text>
<text x="42" y="700" font-size="12" fill="#1b2733" xml:space="preserve">06_embeddings, 07_reduced (.parquet) nếu bật embed</text>
<text x="42" y="717" font-size="12" fill="#1b2733" xml:space="preserve">clean.parquet, knowledge_units.parquet, audit.json, manifest.json, report.html</text>
<rect x="30" y="770" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="781" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text><rect x="185" y="770" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="209" y="781" font-size="11.5" fill="#455566">bước xử lý</text><rect x="291" y="770" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="315" y="781" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text><rect x="467" y="770" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="491" y="781" font-size="11.5" fill="#455566">loại / dừng</text><rect x="580" y="770" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="604" y="781" font-size="11.5" fill="#455566">đầu ra</text><rect x="658" y="770" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="682" y="781" font-size="11.5" fill="#455566">dự kiến, chưa có code</text>
</svg>
