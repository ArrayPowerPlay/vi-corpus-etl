<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 871" width="1040" height="871" font-family="DejaVu Sans, Arial, sans-serif">
<title>Dữ liệu CPT: cpt_segments → cpt_mix (2 pha) → cpt_pack (8.192 token)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1040" height="871" fill="#ffffff"/>
<text x="520.0" y="34.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733" xml:space="preserve">Dữ liệu CPT: cpt_segments → cpt_mix (2 pha) → cpt_pack (8.192 token)</text>
<text x="520.0" y="58.0" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Pipeline xuất dữ liệu trung lập về độ dài ngữ cảnh; mọi lựa chọn phụ thuộc model nằm ở bước cuối</text>
<rect x="40" y="80" width="16" height="16" rx="3" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="62.0" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã có, đã chạy</text>
<rect x="188.8" y="80" width="16" height="16" rx="3" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="210.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã code, chưa đo trên server</text>
<rect x="438.4" y="80" width="16" height="16" rx="3" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="460.4" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đề xuất mới</text>
<rect x="565.6" y="80" width="16" height="16" rx="3" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="587.6" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tuỳ chọn</text>
<rect x="671.2" y="80" width="16" height="16" rx="3" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="693.2" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cổng kiểm tra / đo</text>
<rect x="848.8000000000001" y="80" width="16" height="16" rx="3" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="870.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cần chốt</text>
<rect x="40" y="120" width="300" height="71" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="190.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">clean + KU CPT (finalize)</text>
<text x="190.0" y="159.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đoạn còn giữ, quality_tier, cờ khiếm</text>
<text x="190.0" y="175.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">khuyết</text>
<rect x="370" y="120" width="300" height="103" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="520.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">cpt_segments.parquet (T-07)</text>
<text x="520.0" y="159.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mọi đoạn liền nhau của 1 văn bản, không</text>
<text x="520.0" y="175.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">giới hạn</text>
<text x="520.0" y="191.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">doc_start / doc_end, meta_json,</text>
<text x="520.0" y="207.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">split_bucket</text>
<rect x="700" y="120" width="300" height="87" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="850.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">cpt_mix (đề xuất, L-06)</text>
<text x="850.0" y="159.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tỉ lệ theo pha, epochs theo nguồn ×</text>
<text x="850.0" y="175.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tầng</text>
<text x="850.0" y="191.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">trần 4 lần, tách validation theo họ</text>
<line x1="340.0" y1="155.5" x2="370.0" y2="155.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="670.0" y1="163.5" x2="700.0" y2="163.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="700" y="237" width="145" height="69" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="772.5" y="259.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Replay</text>
<text x="772.5" y="276.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">chung + toán + code</text>
<text x="772.5" y="291.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">(giấy phép K-11)</text>
<rect x="855" y="237" width="145" height="69" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="927.5" y="259.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Chỉ thị có sẵn</text>
<text x="927.5" y="276.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">SEA-Instruct vi +</text>
<text x="927.5" y="291.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">bộ mở toán / code</text>
<rect x="700" y="318" width="300" height="54" rx="8" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="850.0" y="340.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Hỏi–đáp ngắn từ corpus (tuỳ chọn)</text>
<text x="850.0" y="357.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">model nhỏ nội bộ sinh ~5 cặp mỗi đoạn</text>
<line x1="772.5" y1="237.0" x2="772.5" y2="207.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<line x1="927.5" y1="237.0" x2="927.5" y2="207.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<rect x="370" y="412" width="300" height="103" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="520.0" y="434.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">cpt_pack (T-07..T-09)</text>
<text x="520.0" y="451.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cắt ở ranh giới đoạn, best-fit</text>
<text x="520.0" y="467.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">decreasing,</text>
<text x="520.0" y="483.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">EOS chỉ ở cuối thật, --use-metadata-</text>
<text x="520.0" y="499.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">prefix tắt</text>
<polyline points="850.0,372.0 850.0,392.0 630.0,392.0 630.0,412.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="412" width="300" height="87" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="190.0" y="434.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Adapter HF / TRL (L-07)</text>
<text x="190.0" y="451.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">gom theo seq_id, position_ids về 0 mỗi</text>
<text x="190.0" y="467.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mảnh,</text>
<text x="190.0" y="483.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">label = −100 trên prefix, test loss</text>
<line x1="370.0" y1="463.5" x2="340.0" y2="455.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="40.0" y="567.0" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Pha 1 · ổn định (~80–85% token, LR giữ phẳng) — điểm xuất phát, quét ở E-10</text>
<rect x="40.0" y="575" width="480.0" height="30" fill="#7a8aa0" stroke="#ffffff"/>
<text x="280.0" y="594.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">50%</text>
<rect x="520.0" y="575" width="144.0" height="30" fill="#2a78d6" stroke="#ffffff"/>
<text x="592.0" y="594.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">15%</text>
<rect x="664.0" y="575" width="19.2" height="30" fill="#7b4fc4" stroke="#ffffff"/>
<rect x="683.2" y="575" width="28.8" height="30" fill="#c98a1a" stroke="#ffffff"/>
<rect x="712.0" y="575" width="288.0" height="30" fill="#3f9b6b" stroke="#ffffff"/>
<text x="856.0" y="594.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">30%</text>
<rect x="40.0" y="612" width="12" height="12" rx="2" fill="#7a8aa0"/>
<text x="58.0" y="623.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Web Việt 50%</text>
<rect x="159.2" y="612" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="177.2" y="623.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Nguồn tốt lượt 1 15%</text>
<rect x="331.2" y="612" width="12" height="12" rx="2" fill="#7b4fc4"/>
<text x="349.2" y="623.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Chỉ thị 2%</text>
<rect x="437.2" y="612" width="12" height="12" rx="2" fill="#c98a1a"/>
<text x="455.2" y="623.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Hỏi–đáp ngắn 3%</text>
<rect x="576.2" y="612" width="12" height="12" rx="2" fill="#3f9b6b"/>
<text x="594.2" y="623.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Replay EN + toán + code 30%</text>
<text x="40.0" y="669.0" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Pha 2 · decay (~15–20% token cuối, LR giảm) — dữ liệu tốt nhất đặt ở đây</text>
<rect x="40.0" y="677" width="144.0" height="30" fill="#7a8aa0" stroke="#ffffff"/>
<text x="112.0" y="696.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">15%</text>
<rect x="184.0" y="677" width="288.0" height="30" fill="#2a78d6" stroke="#ffffff"/>
<text x="328.0" y="696.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">30%</text>
<rect x="472.0" y="677" width="96.0" height="30" fill="#7b4fc4" stroke="#ffffff"/>
<text x="520.0" y="696.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">10%</text>
<rect x="568.0" y="677" width="76.8" height="30" fill="#c98a1a" stroke="#ffffff"/>
<text x="606.4" y="696.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">8%</text>
<rect x="644.8" y="677" width="307.2" height="30" fill="#3f9b6b" stroke="#ffffff"/>
<text x="798.4" y="696.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">32%</text>
<rect x="952.0" y="677" width="48.0" height="30" fill="#c4503f" stroke="#ffffff"/>
<text x="976.0" y="696.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">5%</text>
<rect x="40.0" y="714" width="12" height="12" rx="2" fill="#7a8aa0"/>
<text x="58.0" y="725.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Web Việt tầng cao 15%</text>
<rect x="218.6" y="714" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="236.6" y="725.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Nguồn tốt lượt 2 30%</text>
<rect x="390.6" y="714" width="12" height="12" rx="2" fill="#7b4fc4"/>
<text x="408.6" y="725.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Chỉ thị 10%</text>
<rect x="503.2" y="714" width="12" height="12" rx="2" fill="#c98a1a"/>
<text x="521.2" y="725.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Hỏi–đáp ngắn 8%</text>
<rect x="642.2" y="714" width="12" height="12" rx="2" fill="#3f9b6b"/>
<text x="660.2" y="725.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Replay 32%</text>
<rect x="748.2" y="714" width="12" height="12" rx="2" fill="#c4503f"/>
<text x="766.2" y="725.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Chuỗi dài 16–32K 5%</text>
<text x="40.0" y="777.0" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Một chuỗi huấn luyện 8.192 token sau cpt_pack (mỗi mảnh tự đếm vị trí từ 0, không nhìn sang mảnh khác)</text>
<rect x="40.0" y="787" width="363.3" height="34" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="221.6" y="808.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">Văn bản A (đoạn cuối)</text>
<rect x="393.3" y="787" width="10" height="34" fill="#1b2733"/>
<rect x="403.3" y="787" width="492.2" height="34" fill="#3f9b6b" stroke="#ffffff" stroke-width="2"/>
<text x="649.4" y="808.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">Văn bản B (đoạn giữa)</text>
<rect x="895.5" y="787" width="93.8" height="34" fill="#c98a1a" stroke="#ffffff" stroke-width="2"/>
<text x="942.3" y="808.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">C (trọn)</text>
<rect x="979.2" y="787" width="10" height="34" fill="#1b2733"/>
<rect x="989.2" y="787" width="10.8" height="34" fill="#d5dbe3" stroke="#ffffff" stroke-width="2"/>
<text x="40.0" y="841.0" text-anchor="start" font-size="11" font-weight="400" fill="#52514e" xml:space="preserve">■ đen = EOS (chỉ khi mảnh chứa cuối thật của văn bản). B bị cắt giữa nên không có EOS; phần còn lại của B nằm ở chuỗi khác.</text>
</svg>
