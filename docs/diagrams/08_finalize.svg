<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 8: finalize (clean, knowledge unit, audit, báo cáo)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="764" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 8: finalize (clean, knowledge unit, audit, báo cáo)</text>
<text x="500.0" y="58" text-anchor="middle" font-size="12" fill="#52514e">vi_corpus/pipeline/runner.py · knowledge.py · audit.py · report.py</text>
<rect x="30" y="84" width="530" height="28" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="42" y="106" font-size="14" font-weight="700" fill="#1b2733">Bản ghi sau dedup (+ 07_reduced nếu có)</text>
<line x1="295.0" y1="112" x2="295.0" y2="150" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="152" width="530" height="51" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="42" y="174" font-size="14" font-weight="700" fill="#1b2733">clean.parquet</text>
<text x="42" y="194" font-size="12" fill="#1b2733" xml:space="preserve">chỉ các bản ghi status = kept</text>
<line x1="295.0" y1="203" x2="295.0" y2="241" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="243" width="530" height="102" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="265" font-size="14" font-weight="700" fill="#1b2733">build_units (knowledge.py)</text>
<text x="42" y="285" font-size="12" fill="#1b2733" xml:space="preserve">SEA-Instruct có cặp (lượt người → lượt trợ lý liền kề): mỗi cặp 1 unit SFT</text>
<text x="42" y="302" font-size="12" fill="#1b2733" xml:space="preserve">còn lại (và hội thoại không có cặp hợp lệ): 1 unit CPT = cả văn bản / đoạn</text>
<text x="42" y="319" font-size="12" fill="#1b2733" xml:space="preserve">split_bucket = sha1(dedup_family_id) % 100 → chia train/val/test sau theo họ</text>
<text x="42" y="336" font-size="12" fill="#1b2733" xml:space="preserve">Hybrid không sinh ở đây (ghép ở bước huấn luyện)</text>
<rect x="680" y="243" width="290" height="51" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="692" y="265" font-size="14" font-weight="700" fill="#1b2733">knowledge_units.parquet</text>
<text x="692" y="285" font-size="12" fill="#1b2733" xml:space="preserve">KU_SCHEMA</text>
<line x1="560" y1="263" x2="678" y2="263" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="295.0" y1="345" x2="295.0" y2="383" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="385" width="530" height="119" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="407" font-size="14" font-weight="700" fill="#1b2733">audit_rows (audit.py)</text>
<text x="42" y="427" font-size="12" fill="#1b2733" xml:space="preserve">lineage_rate (đủ source_key, source_path, source_sha256), mục tiêu 0,95</text>
<text x="42" y="444" font-size="12" fill="#1b2733" xml:space="preserve">funnel theo nguồn: input → rejected:* → kept</text>
<text x="42" y="461" font-size="12" fill="#1b2733" xml:space="preserve">token: words/tokens in và kept theo nguồn</text>
<text x="42" y="478" font-size="12" fill="#1b2733" xml:space="preserve">PII: đếm bản ghi có email / số điện thoại VN (không sửa text)</text>
<text x="42" y="495" font-size="12" fill="#1b2733" xml:space="preserve">contamination: ghi "chưa chạy" (chưa có benchmark)</text>
<rect x="680" y="385" width="290" height="28" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="692" y="407" font-size="14" font-weight="700" fill="#1b2733">audit.json</text>
<line x1="560" y1="405" x2="678" y2="405" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="295.0" y1="504" x2="295.0" y2="542" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="544" width="530" height="51" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="566" font-size="14" font-weight="700" fill="#1b2733">manifest.json</text>
<text x="42" y="586" font-size="12" fill="#1b2733" xml:space="preserve">thống kê finalize + toàn bộ RunConfig</text>
<line x1="295.0" y1="595" x2="295.0" y2="633" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="635" width="530" height="51" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="42" y="657" font-size="14" font-weight="700" fill="#1b2733">report.html (một file tự chứa)</text>
<text x="42" y="677" font-size="12" fill="#1b2733" xml:space="preserve">KPI, funnel, band theo nguồn, reason code, ví dụ, bản đồ embedding</text>
<rect x="30" y="730" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="741" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text><rect x="185" y="730" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="209" y="741" font-size="11.5" fill="#455566">bước xử lý</text><rect x="291" y="730" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="315" y="741" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text><rect x="467" y="730" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="491" y="741" font-size="11.5" fill="#455566">loại / dừng</text><rect x="580" y="730" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="604" y="741" font-size="11.5" fill="#455566">đầu ra</text><rect x="658" y="730" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="682" y="741" font-size="11.5" fill="#455566">dự kiến, chưa có code</text>
