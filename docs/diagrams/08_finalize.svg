<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 922" width="1000" height="922" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 8: finalize (clean, knowledge unit, segment CPT, audit, báo cáo)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="922" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 8: finalize (clean, knowledge unit, segment CPT, audit, báo cáo)</text>
<text x="500.0" y="50" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#6a7a8a">vi_corpus/pipeline/runner.py · knowledge.py · contamination.py · audit.py · report.py · cpt_pack.py</text>
<rect x="30" y="70" width="620" height="30" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="42" y="92" font-size="14" font-weight="700" fill="#1b2733">Bản ghi sau dedup (+ 07_reduced.parquet nếu có)</text>
<rect x="30" y="130" width="620" height="73" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="152" font-size="14" font-weight="700" fill="#1b2733">Có --global-verdict?</text>
<text x="42" y="169.5" font-size="12" fill="#1b2733" xml:space="preserve">có: apply_verdict (dedup_global.py) cập nhật status và họ trùng theo dedup vòng 2</text>
<text x="42" y="186.0" font-size="12" fill="#1b2733" xml:space="preserve">(D-09), đếm superseded; không có thì họ trùng chỉ là của lần chạy này.</text>
<rect x="30" y="240" width="620" height="56" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="262" font-size="14" font-weight="700" fill="#1b2733">clean.parquet</text>
<text x="42" y="279.5" font-size="12" fill="#1b2733" xml:space="preserve">chỉ các bản ghi status = kept.</text>
<rect x="30" y="315" width="620" height="106" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="337" font-size="14" font-weight="700" fill="#1b2733">build_units → knowledge_units.parquet</text>
<text x="42" y="354.5" font-size="12" fill="#1b2733" xml:space="preserve">CPT: mỗi đoạn giữ lại là 1 đơn vị (candidate). SFT: mỗi cặp (người → trợ lý) liền kề</text>
<text x="42" y="371.0" font-size="12" fill="#1b2733" xml:space="preserve">của SEA-Instruct là 1 đơn vị (instruction).</text>
<text x="42" y="387.5" font-size="12" fill="#1b2733" xml:space="preserve">split_bucket = sha1(dedup_family_id) % 100: chia train / val / test sau này theo họ</text>
<text x="42" y="404.0" font-size="12" fill="#1b2733" xml:space="preserve">trùng, không chia ở tầng corpus. Hybrid ghép ở bước huấn luyện.</text>
<rect x="30" y="450" width="620" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="472" font-size="14" font-weight="700" fill="#1b2733">build_cpt_segments → cpt_segments.parquet</text>
<text x="42" y="489.5" font-size="12" fill="#1b2733" xml:space="preserve">nối MỌI đoạn liền nhau còn giữ của cùng văn bản thành 1 segment, không giới hạn độ</text>
<text x="42" y="506.0" font-size="12" fill="#1b2733" xml:space="preserve">dài (gặp đoạn bị loại thì ngắt); kèm lineage, quyền, họ trùng, số token, cờ đầu /</text>
<text x="42" y="522.5" font-size="12" fill="#1b2733" xml:space="preserve">cuối văn bản; metadata (tiêu đề, tạp chí, năm, ngành...) ở cột riêng.</text>
<rect x="30" y="575" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="597" font-size="14" font-weight="700" fill="#1b2733">contamination.scan</text>
<text x="42" y="614.5" font-size="12" fill="#1b2733" xml:space="preserve">13-gram với configs/benchmarks/*.txt | *.jsonl; danh sách hiện RỖNG nên chưa quét gì.</text>
<text x="42" y="631.0" font-size="12" fill="#1b2733" xml:space="preserve">Chỉ đếm / đánh dấu, không loại.</text>
<rect x="690" y="640" width="280" height="90" rx="8" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="702" y="662" font-size="14" font-weight="700" fill="#6a6a6a">Viết lại (L-01)</text>
<text x="702" y="679.5" font-size="12" fill="#6a6a6a" xml:space="preserve">quét theo từng câu benchmark (cả đáp</text>
<text x="702" y="696.0" font-size="12" fill="#6a6a6a" xml:space="preserve">án), 8-gram, vòng ngữ nghĩa; chờ</text>
<text x="702" y="712.5" font-size="12" fill="#6a6a6a" xml:space="preserve">K-01.</text>
<polyline points="650.0,611.5 670.0,611.5 670.0,684.8 690.0,684.8" fill="none" stroke="#455566" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="30" y="665" width="620" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="687" font-size="14" font-weight="700" fill="#1b2733">audit_rows → audit.json</text>
<text x="42" y="704.5" font-size="12" fill="#1b2733" xml:space="preserve">lineage_rate (đủ source_key, source_path, source_sha256) mục tiêu ≥ 0,95; phễu theo</text>
<text x="42" y="721.0" font-size="12" fill="#1b2733" xml:space="preserve">nguồn: vào → rejected:* → kept; token (và so với tokenizer khác); PII: đếm email / số</text>
<text x="42" y="737.5" font-size="12" fill="#1b2733" xml:space="preserve">điện thoại VN (không sửa text).</text>
<rect x="30" y="785" width="300" height="73" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="807" font-size="14" font-weight="700" fill="#1b2733">manifest.json</text>
<text x="42" y="824.5" font-size="12" fill="#1b2733" xml:space="preserve">cấu hình, vân tay, giờ, RAM đỉnh, thống</text>
<text x="42" y="841.0" font-size="12" fill="#1b2733" xml:space="preserve">kê từng stage</text>
<rect x="350" y="785" width="300" height="73" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="362" y="807" font-size="14" font-weight="700" fill="#1b2733">report.html</text>
<text x="362" y="824.5" font-size="12" fill="#1b2733" xml:space="preserve">một file tự chứa: KPI, phễu, band,</text>
<text x="362" y="841.0" font-size="12" fill="#1b2733" xml:space="preserve">reason code, ví dụ, bản đồ embedding</text>
<polyline points="340.0,100.0 340.0,130.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,203.0 340.0,240.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,296.5 340.0,315.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,421.0 340.0,450.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,539.5 340.0,575.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,648.0 340.0,665.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="180.0,754.5 180.0,785.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="500.0,754.5 500.0,785.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="450" width="280" height="122" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="702" y="472" font-size="14" font-weight="700" fill="#1b2733">scripts/cpt_pack.py (ngoài pipeline)</text>
<text x="702" y="489.5" font-size="12" fill="#1b2733" xml:space="preserve">cắt segment theo ngữ cảnh 8.192</text>
<text x="702" y="506.0" font-size="12" fill="#1b2733" xml:space="preserve">token, ghép best-fit, EOS chỉ ở cuối</text>
<text x="702" y="522.5" font-size="12" fill="#1b2733" xml:space="preserve">văn bản thật; tiền tố metadata tắt</text>
<text x="702" y="539.0" font-size="12" fill="#1b2733" xml:space="preserve">(--use-metadata-prefix). Đổi cỡ ngữ</text>
<text x="702" y="555.5" font-size="12" fill="#1b2733" xml:space="preserve">cảnh không phải chạy lại pipeline.</text>
<polyline points="650.0,494.8 670.0,494.8 670.0,511.2 690.0,511.2" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="315" width="280" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="702" y="337" font-size="14" font-weight="700" fill="#1b2733">make_judge_sample.py (ngoài pipeline)</text>
<text x="702" y="354.5" font-size="12" fill="#1b2733" xml:space="preserve">mẫu 50k phân tầng nguồn × độ dài để</text>
<text x="702" y="371.0" font-size="12" fill="#1b2733" xml:space="preserve">LLM chấm (chưa có judge).</text>
<polyline points="650.0,368.0 670.0,368.0 670.0,351.5 690.0,351.5" fill="none" stroke="#455566" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="30" y="886" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="897" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text>
<rect x="187" y="886" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="211" y="897" font-size="11.5" fill="#455566">bước xử lý (CPU)</text>
<rect x="337" y="886" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="361" y="897" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text>
<rect x="513" y="886" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="537" y="897" font-size="11.5" fill="#455566">đầu ra</text>
<rect x="600" y="886" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="624" y="897" font-size="11.5" fill="#455566">chưa có code</text>
</svg>
