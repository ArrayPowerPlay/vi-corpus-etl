<text x="42" y="444" font-size="12" fill="#1b2733" xml:space="preserve">repetitive −20, dup_lines_some −15, digit_heavy −15, symbol_heavy −15,</text>
<text x="42" y="461" font-size="12" fill="#1b2733" xml:space="preserve">mostly_upper −15, odd_word_length −15, some_replacement_chars −10</text>
