<text x="42" y="174" font-size="14" font-weight="700" fill="#1b2733">compute_metrics (không phụ thuộc nguồn)</text>
<text x="42" y="194" font-size="12" fill="#1b2733" xml:space="preserve">theo ký tự: alpha, digit, symbol, upper, replacement (�), mean_word_len</text>
<text x="42" y="211" font-size="12" fill="#1b2733" xml:space="preserve">theo dòng: dup_line, short_line, bullet, end_punct, boilerplate_line</text>
<text x="42" y="228" font-size="12" fill="#1b2733" xml:space="preserve">khác: url / từ, rep_trigram (tỷ lệ trigram từ lặp), words, lines</text>
