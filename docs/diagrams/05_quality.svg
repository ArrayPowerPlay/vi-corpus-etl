<text x="42" y="299" font-size="14" font-weight="700" fill="#1b2733">Lỗi cứng (ngưỡng theo SourceProfile của nguồn)</text>
<text x="42" y="319" font-size="12" fill="#1b2733" xml:space="preserve">empty, too_short (&lt; min_words), too_long (&gt; max_words), lang_not_allowed,</text>
<text x="42" y="336" font-size="12" fill="#1b2733" xml:space="preserve">low_alpha (&lt; min_alpha), replacement_chars (&gt; 0,5%),</text>
<text x="42" y="353" font-size="12" fill="#1b2733" xml:space="preserve">repeated_ngrams (rep_trigram &gt; 0,5), duplicate_lines (dup_line &gt; 0,5)</text>
