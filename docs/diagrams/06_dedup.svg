<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1113" width="1000" height="1113" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 6: dedup (vòng 1 trong lần chạy, vòng 2 toàn cục) và cổng quyền</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="1113" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 6: dedup (vòng 1 trong lần chạy, vòng 2 toàn cục) và cổng quyền</text>
<text x="500.0" y="50" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#6a7a8a">vi_corpus/pipeline/dedup.py · dedup_global.py · scripts/dedup_global.py</text>
<rect x="30" y="70" width="620" height="30" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="42" y="92" font-size="14" font-weight="700" fill="#1b2733">04_quality.parquet</text>
<rect x="30" y="130" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="152" font-size="14" font-weight="700" fill="#1b2733">Cổng quyền</text>
<text x="42" y="169.5" font-size="12" fill="#1b2733" xml:space="preserve">rights_status ∈ OPEN_RIGHTS → pass, còn lại quarantine. Mặc định chỉ gắn nhãn (R-01);</text>
<text x="42" y="186.0" font-size="12" fill="#1b2733" xml:space="preserve">chế độ enforce mới loại.</text>
<rect x="30" y="220" width="620" height="30" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="242" font-size="14" font-weight="700" fill="#1b2733">quality_band ∈ keep_bands (A, B, C)?</text>
<rect x="690" y="220" width="280" height="73" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.6"/>
<text x="702" y="242" font-size="14" font-weight="700" fill="#1b2733">rejected:quality</text>
<text x="702" y="259.5" font-size="12" fill="#1b2733" xml:space="preserve">band D bị loại khỏi clean, nhưng vẫn</text>
<text x="702" y="276.0" font-size="12" fill="#1b2733" xml:space="preserve">nằm trong 05_dedup.parquet.</text>
<polyline points="650.0,235.0 670.0,235.0 670.0,256.5 690.0,256.5" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="639.0" y="218.0" width="38.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="660.0" y="229.0" text-anchor="middle" font-size="11.5" fill="#455566">không</text>
<rect x="30" y="290" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="312" font-size="14" font-weight="700" fill="#1b2733">Gom đoạn theo văn bản (parent_doc_id), 2 nhóm</text>
<text x="42" y="329.5" font-size="12" fill="#1b2733" xml:space="preserve">cpt: mọi nguồn dedup chung với nhau; sft: SEA-Instruct chỉ dedup trong nhóm của mình</text>
<text x="42" y="346.0" font-size="12" fill="#1b2733" xml:space="preserve">(Q4).</text>
<rect x="30" y="385" width="620" height="56" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="407" font-size="14" font-weight="700" fill="#1b2733">Exact</text>
<text x="42" y="424.5" font-size="12" fill="#1b2733" xml:space="preserve">trùng doc_sha256 của cả văn bản gốc → dup_kind = exact.</text>
<rect x="30" y="460" width="620" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="482" font-size="14" font-weight="700" fill="#1b2733">Fuzzy: MinHash cả văn bản</text>
<text x="42" y="499.5" font-size="12" fill="#1b2733" xml:space="preserve">chữ ký doc_minhash (128 hoán vị, shingle 5 từ, văn bản ≥ 20 từ); LSH 16 băng × 8</text>
<text x="42" y="516.0" font-size="12" fill="#1b2733" xml:space="preserve">hàng, bucket lớn chỉ so với phần tử đầu; xác nhận Jaccard ước lượng ≥ 0,8 → dup_kind</text>
<text x="42" y="532.5" font-size="12" fill="#1b2733" xml:space="preserve">= fuzzy.</text>
<rect x="30" y="575" width="620" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="597" font-size="14" font-weight="700" fill="#1b2733">L1 bao hàm</text>
<text x="42" y="614.5" font-size="12" fill="#1b2733" xml:space="preserve">băm đoạn văn (≥ para_min_words từ); văn bản có ≥ 3 đoạn dài mà ≥ 80% nằm trong MỘT</text>
<text x="42" y="631.0" font-size="12" fill="#1b2733" xml:space="preserve">văn bản lớn hơn → dup_kind = contained, chung họ với văn bản chứa nó. Chỉ trong phạm</text>
<text x="42" y="647.5" font-size="12" fill="#1b2733" xml:space="preserve">vi lần chạy.</text>
<rect x="30" y="690" width="620" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="712" font-size="14" font-weight="700" fill="#1b2733">Chọn bản giữ của mỗi họ trùng</text>
<text x="42" y="729.5" font-size="12" fill="#1b2733" xml:space="preserve">union-find; ưu tiên nguồn (VJOL 0 → SEA 1 → stbook 2 → khác 3, R-15) → điểm rule</text>
<text x="42" y="746.0" font-size="12" fill="#1b2733" xml:space="preserve">trung bình → doc_id. dedup_family_id = fam_&lt;sha1 của đại diện&gt;; mọi đoạn của văn bản</text>
<text x="42" y="762.5" font-size="12" fill="#1b2733" xml:space="preserve">trùng → rejected:duplicate (dup_kind, dup_of).</text>
<rect x="30" y="810" width="620" height="56" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="832" font-size="14" font-weight="700" fill="#1b2733">Exact theo đoạn</text>
<text x="42" y="849.5" font-size="12" fill="#1b2733" xml:space="preserve">đoạn có text giống hệt một đoạn tốt hơn ở văn bản khác trong nhóm → loại.</text>
<rect x="30" y="885" width="620" height="73" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="907" font-size="14" font-weight="700" fill="#1b2733">05_dedup.parquet</text>
<text x="42" y="924.5" font-size="12" fill="#1b2733" xml:space="preserve">TẤT CẢ bản ghi, kể cả bị loại; status = kept | rejected:quality | rejected:duplicate</text>
<text x="42" y="941.0" font-size="12" fill="#1b2733" xml:space="preserve">| rejected:rights; thống kê exact / fuzzy / contained, họ nhiều bản, quarantined.</text>
<polyline points="340.0,100.0 340.0,130.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,203.0 340.0,220.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,250.0 340.0,290.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="344.0" y="259.0" width="18.8" height="15" fill="#ffffff" opacity="0.9"/>
<text x="346.0" y="270.0" text-anchor="start" font-size="11.5" fill="#455566">có</text>
<polyline points="340.0,363.0 340.0,385.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,441.5 340.0,460.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,549.5 340.0,575.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,664.5 340.0,690.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,779.5 340.0,810.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,866.5 340.0,885.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="690" width="280" height="106" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="702" y="712" font-size="14" font-weight="700" fill="#1b2733">Kho dấu vân tay vòng 1</text>
<text x="702" y="729.5" font-size="12" fill="#1b2733" xml:space="preserve">state/dedup_index/&lt;nguồn&gt;/&lt;run&gt;.parquet:</text>
<text x="702" y="746.0" font-size="12" fill="#1b2733" xml:space="preserve">doc_id, sha256, MinHash, điểm, quyền</text>
<text x="702" y="762.5" font-size="12" fill="#1b2733" xml:space="preserve">của mọi văn bản (bản bị loại = bia</text>
<text x="702" y="779.0" font-size="12" fill="#1b2733" xml:space="preserve">mộ, alive = False). Không có text.</text>
<polyline points="650.0,734.8 670.0,734.8 670.0,743.0 690.0,743.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="810" width="280" height="139" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="702" y="832" font-size="14" font-weight="700" fill="#1b2733">Vòng 2: scripts/dedup_global.py</text>
<text x="702" y="849.5" font-size="12" fill="#1b2733" xml:space="preserve">gộp kho của MỌI nguồn (dòng</text>
<text x="702" y="866.0" font-size="12" fill="#1b2733" xml:space="preserve">written_at mới nhất), ưu tiên tính</text>
<text x="702" y="882.5" font-size="12" fill="#1b2733" xml:space="preserve">lại, họ trùng toàn cục →</text>
<text x="702" y="899.0" font-size="12" fill="#1b2733" xml:space="preserve">processed/dedup_global/verdict.parquet</text>
<text x="702" y="915.5" font-size="12" fill="#1b2733" xml:space="preserve">(kept / duplicate / rights; chỉ đánh</text>
<text x="702" y="932.0" font-size="12" fill="#1b2733" xml:space="preserve">dấu).</text>
<polyline points="830.0,796.0 830.0,810.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="960" width="280" height="90" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="702" y="982" font-size="14" font-weight="700" fill="#1b2733">Áp ở finalize</text>
<text x="702" y="999.5" font-size="12" fill="#1b2733" xml:space="preserve">run_pipeline.py --global-verdict</text>
<text x="702" y="1016.0" font-size="12" fill="#1b2733" xml:space="preserve">...: knowledge unit và chia split</text>
<text x="702" y="1032.5" font-size="12" fill="#1b2733" xml:space="preserve">sinh SAU vòng 2.</text>
<polyline points="830.0,949.0 830.0,960.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="470" width="280" height="90" rx="8" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="702" y="492" font-size="14" font-weight="700" fill="#6a6a6a">L3 semantic dedup</text>
<text x="702" y="509.5" font-size="12" fill="#6a6a6a" xml:space="preserve">SemDeDup trên embedding (D-03): chưa</text>
<text x="702" y="526.0" font-size="12" fill="#6a6a6a" xml:space="preserve">làm; chờ chốt mô hình embedding</text>
<text x="702" y="542.5" font-size="12" fill="#6a6a6a" xml:space="preserve">(K-07).</text>
<rect x="30" y="1077" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="1088" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text>
<rect x="187" y="1077" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="211" y="1088" font-size="11.5" fill="#455566">bước xử lý (CPU)</text>
<rect x="337" y="1077" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="361" y="1088" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text>
<rect x="513" y="1077" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="537" y="1088" font-size="11.5" fill="#455566">loại / dừng</text>
<rect x="632" y="1077" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="656" y="1088" font-size="11.5" fill="#455566">đầu ra</text>
<rect x="719" y="1077" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="743" y="1088" font-size="11.5" fill="#455566">chưa có code</text>
</svg>
