<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1054" width="1000" height="1054" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 6: dedup + cổng quyền (hiện tại, trong RAM)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="1054" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 6: dedup + cổng quyền (hiện tại, trong RAM)</text>
<text x="500.0" y="58" text-anchor="middle" font-size="12" fill="#52514e">vi_corpus/pipeline/dedup.py</text>
<rect x="30" y="84" width="530" height="28" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="42" y="106" font-size="14" font-weight="700" fill="#1b2733">04_quality.parquet</text>
<line x1="295.0" y1="112" x2="295.0" y2="150" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="152" width="530" height="51" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="174" font-size="14" font-weight="700" fill="#1b2733">Cổng quyền</text>
<text x="42" y="194" font-size="12" fill="#1b2733" xml:space="preserve">rights_status ∈ {open, cleared} → rights_gate = pass, còn lại quarantine</text>
<line x1="295.0" y1="203" x2="295.0" y2="241" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="243" width="530" height="28" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.5"/>
<text x="42" y="265" font-size="14" font-weight="700" fill="#1b2733">quality_band ∉ keep_bands (A, B, C)?</text>
<rect x="680" y="243" width="290" height="28" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.5"/>
<text x="692" y="265" font-size="14" font-weight="700" fill="#1b2733">rejected:quality</text>
<line x1="560" y1="263" x2="678" y2="263" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="257" text-anchor="middle" font-size="11.5" fill="#455566">có</text>
<line x1="295.0" y1="271" x2="295.0" y2="309" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="303.0" y="295.0" font-size="11.5" fill="#455566">không</text>
<rect x="30" y="311" width="530" height="51" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.5"/>
<text x="42" y="333" font-size="14" font-weight="700" fill="#1b2733">rights_gate = enforce và bản ghi quarantine?</text>
<text x="42" y="353" font-size="12" fill="#1b2733" xml:space="preserve">mặc định rights_gate = tag: chỉ gắn nhãn, không loại</text>
<rect x="680" y="311" width="290" height="28" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.5"/>
<text x="692" y="333" font-size="14" font-weight="700" fill="#1b2733">rejected:rights</text>
<line x1="560" y1="331" x2="678" y2="331" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="325" text-anchor="middle" font-size="11.5" fill="#455566">có</text>
<line x1="295.0" y1="362" x2="295.0" y2="400" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="303.0" y="386.0" font-size="11.5" fill="#455566">không</text>
<rect x="30" y="402" width="530" height="51" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="424" font-size="14" font-weight="700" fill="#1b2733">Sắp bản còn sống</text>
<text x="42" y="444" font-size="12" fill="#1b2733" xml:space="preserve">theo (−quality_score, doc_id): chỉ số nhỏ = bản tốt hơn = đại diện họ</text>
<line x1="295.0" y1="453" x2="295.0" y2="491" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="493" width="530" height="51" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="515" font-size="14" font-weight="700" fill="#1b2733">Exact</text>
<text x="42" y="535" font-size="12" fill="#1b2733" xml:space="preserve">sha256 text chuẩn hoá; trùng bản đã thấy → union, dup_kind = exact</text>
<line x1="295.0" y1="544" x2="295.0" y2="582" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="584" width="530" height="68" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="606" font-size="14" font-weight="700" fill="#1b2733">MinHash</text>
<text x="42" y="626" font-size="12" fill="#1b2733" xml:space="preserve">văn bản ≥ 20 từ; ≤ 20.000 từ đầu; shingle 5 từ → crc32</text>
<text x="42" y="643" font-size="12" fill="#1b2733" xml:space="preserve">128 hoán vị (a·x + b) mod 2^32, seed cố định 12345</text>
<line x1="295.0" y1="652" x2="295.0" y2="690" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="692" width="530" height="68" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="714" font-size="14" font-weight="700" fill="#1b2733">LSH + xác nhận</text>
<text x="42" y="734" font-size="12" fill="#1b2733" xml:space="preserve">16 băng × 8 hàng → bucket; mọi cặp trong cùng bucket là ứng viên</text>
<text x="42" y="751" font-size="12" fill="#1b2733" xml:space="preserve">giữ cặp có Jaccard ước lượng ≥ fuzzy_threshold (0,8)</text>
<line x1="295.0" y1="760" x2="295.0" y2="798" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="800" width="530" height="51" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="822" font-size="14" font-weight="700" fill="#1b2733">Union-find → họ trùng</text>
<text x="42" y="842" font-size="12" fill="#1b2733" xml:space="preserve">gốc = bản điểm cao nhất; dedup_family_id = "fam_" + sha1(doc_id đại diện)[:12]</text>
<rect x="680" y="800" width="290" height="68" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.5"/>
<text x="692" y="822" font-size="14" font-weight="700" fill="#1b2733">rejected:duplicate</text>
<text x="692" y="842" font-size="12" fill="#1b2733" xml:space="preserve">dup_kind = exact | fuzzy</text>
<text x="692" y="859" font-size="12" fill="#1b2733" xml:space="preserve">dup_of = doc_id đại diện</text>
<line x1="560" y1="820" x2="678" y2="820" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="814" text-anchor="middle" font-size="11.5" fill="#455566">không phải gốc</text>
<line x1="295.0" y1="851" x2="295.0" y2="906" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="908" width="530" height="68" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="42" y="930" font-size="14" font-weight="700" fill="#1b2733">05_dedup.parquet</text>
<text x="42" y="950" font-size="12" fill="#1b2733" xml:space="preserve">TẤT CẢ bản ghi kể cả bị loại; status = kept | rejected:*</text>
<text x="42" y="967" font-size="12" fill="#1b2733" xml:space="preserve">thống kê: exact_dups, fuzzy_dups, families_multi, quarantined</text>
<rect x="680" y="908" width="290" height="68" rx="8" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="692" y="930" font-size="14" font-weight="700" fill="#6a6a6a">Dự kiến (D-03)</text>
<text x="692" y="950" font-size="12" fill="#6a6a6a" xml:space="preserve">4 tầng L0-L3 chạy theo shard,</text>
<text x="692" y="967" font-size="12" fill="#6a6a6a" xml:space="preserve">shuffle trên đĩa, toàn cục mọi nguồn</text>
<line x1="560" y1="928" x2="678" y2="928" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="922" text-anchor="middle" font-size="11.5" fill="#455566">sẽ đổi</text>
<rect x="30" y="1020" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="1031" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text><rect x="185" y="1020" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="209" y="1031" font-size="11.5" fill="#455566">bước xử lý</text><rect x="291" y="1020" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="315" y="1031" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text><rect x="467" y="1020" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="491" y="1031" font-size="11.5" fill="#455566">loại / dừng</text><rect x="580" y="1020" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="604" y="1031" font-size="11.5" fill="#455566">đầu ra</text><rect x="658" y="1020" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="682" y="1031" font-size="11.5" fill="#455566">dự kiến, chưa có code</text>
</svg>
