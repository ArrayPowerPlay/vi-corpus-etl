<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="DejaVu Sans, Arial, sans-serif">
<title>Tầng 0: từ văn bản sạch thành dữ liệu kiến thức</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="1000" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733" xml:space="preserve">Tầng 0: từ văn bản sạch thành dữ liệu kiến thức</text>
<text x="500.0" y="58" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Đơn vị làm việc là SỰ KIỆN NGUYÊN TỬ có nguồn, không phải token hay đoạn văn</text>
<rect x="250" y="80" width="500" height="52" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="500.0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">clean.parquet / KU CPT</text>
<text x="500.0" y="122" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đoạn đã lọc + dedup, có doc_id, chunk_index, dedup_family_id</text>
<line x1="500" y1="132" x2="500" y2="160" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="200" y="162" width="600" height="88" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">B1 · Teacher trích sự kiện nguyên tử (nhiều lượt)</text>
<text x="500.0" y="204" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">model mở giỏi tiếng Việt, đã đọc thử 200 mẫu bằng tay trước khi chạy hàng loạt</text>
<text x="500.0" y="221" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">lượt 1: tìm thực thể · lượt 2: trích sự kiện, lượt 3: bắt sự kiện sót</text>
<text x="500.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mỗi sự kiện phải nêu rõ tên thực thể (đọc riêng vẫn hiểu)</text>
<line x1="500" y1="250" x2="500" y2="278" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="280" width="700" height="112" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="500.0" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">B2 · Bộ lọc trước khi tin dữ liệu sinh</text>
<text x="500.0" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">① bám nguồn: câu/đoạn nguồn có chứa bằng chứng cho sự kiện</text>
<text x="500.0" y="339" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">② thực thể của sự kiện có xuất hiện trong nguồn</text>
<text x="500.0" y="356" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">③ khử trùng lặp sự kiện (cùng ý, khác chữ)  ④ round-trip: hỏi lại, đáp phải khớp</text>
<text x="500.0" y="373" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mẫu 200 sự kiện đọc tay → ghi tỷ lệ sai (chưa có nguồn nào đo con số này)</text>
<line x1="500" y1="392" x2="500" y2="420" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="422" width="700" height="62" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="500.0" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">facts.parquet  (tài sản gốc)</text>
<text x="500.0" y="464" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">fact_id · fact_text · entity · doc_id · chunk_index · dedup_family_id · rights_status</text>
<line x1="500" y1="484" x2="175" y2="524" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="500" y1="484" x2="500" y2="524" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="500" y1="484" x2="825" y2="524" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="526" width="290" height="168" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="548" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">B3a · Biến thể + chỉ thị</text>
<text x="42" y="568" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">3–5 cách diễn đạt mỗi sự kiện</text>
<text x="42" y="585" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">(Knowledge-Instruct: bão hoà ~3)</text>
<text x="42" y="602" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">~10 cặp hỏi–đáp khác nhau / sự kiện</text>
<text x="42" y="619" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">(Mecklenburg: phủ đều hơn theo token)</text>
<text x="42" y="636" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">chuyển thành chỉ thị bằng mẫu quy tắc</text>
<text x="42" y="653" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">(bài gốc dùng 25 mẫu)</text>
<rect x="355" y="526" width="290" height="168" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="367" y="548" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">B3b · Viết lại cấp tài liệu</text>
<text x="367" y="568" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">kiểu Active Reading: model tự chọn</text>
<text x="367" y="585" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cách học (tóm tắt, hỏi–đáp, ví dụ,</text>
<text x="367" y="602" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">liên hệ) cho từng tài liệu</text>
<text x="367" y="619" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">dùng cho kiến thức rộng, tự sinh</text>
<text x="367" y="636" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">bằng chính model sẽ học</text>
<text x="367" y="653" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">giữ văn bản thật trong hỗn hợp</text>
<rect x="680" y="526" width="290" height="168" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="692" y="548" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">B3c · Tập RAFT</text>
<text x="692" y="568" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">câu hỏi + chunk đúng + vài chunk</text>
<text x="692" y="585" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">gây nhiễu → đáp có lập luận,</text>
<text x="692" y="602" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">trích đúng chunk</text>
<text x="692" y="619" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">một phần mẫu cố ý KHÔNG có chunk</text>
<text x="692" y="636" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đúng (như RAFT) để không phụ</text>
<text x="692" y="653" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">thuộc hoàn toàn vào retrieval</text>
<line x1="175" y1="694" x2="500" y2="730" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="500" y1="694" x2="500" y2="730" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="825" y1="694" x2="500" y2="730" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="732" width="700" height="86" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="500.0" y="754" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">B4 · Chia theo họ trùng (dedup_family_id, split_bucket)</text>
<text x="500.0" y="774" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">sự kiện của họ train → dữ liệu SFT; sự kiện của họ val/test → GIỮ LẠI làm eval</text>
<text x="500.0" y="791" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mọi biến thể của cùng một sự kiện luôn nằm cùng phía (đúng quyết định P-05)</text>
<text x="500.0" y="808" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">quét 13-gram corpus ↔ bộ eval công khai trước khi báo điểm (contamination.py)</text>
<line x1="300" y1="818" x2="200" y2="850" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="700" y1="818" x2="800" y2="850" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="852" width="480" height="78" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="874" text-anchor="start" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">Đầu ra huấn luyện</text>
<text x="42" y="894" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">sft_knowledge.parquet · sft_rag.parquet (RAFT)</text>
<text x="42" y="911" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">dùng ở Tầng 2 (và làm giàu index ở Tầng 1)</text>
<rect x="530" y="852" width="440" height="78" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="542" y="874" text-anchor="start" font-size="14" font-weight="700" fill="#1b2733" xml:space="preserve">Đầu ra eval</text>
<text x="542" y="894" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">Eval A (đã dạy): hỏi bằng cách diễn đạt MỚI</text>
<text x="542" y="911" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">Eval B (chưa thấy): sự kiện họ giữ lại → đo bịa vs từ chối</text>
<text x="500" y="962" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e" xml:space="preserve">Nhãn Known / MaybeKnown / Unknown gắn theo TỪNG base (đo ở Bước 0) và lưu file riêng, không ghi vào facts.parquet gốc.</text>
<text x="500" y="980" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e" xml:space="preserve">Các lượt, số biến thể và số mẫu là cấu hình của các bài gốc (tiếng Anh); chưa có bài nào chạy cho tiếng Việt.</text>
</svg>
