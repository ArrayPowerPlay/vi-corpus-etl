<text x="500" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">Đọc nhanh: (1) CPT trên văn bản thô của một corpus nhỏ còn thấp hơn model gốc → đừng trông chờ CPT thô nạp được sự kiện.</text>
<text x="500" y="490" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">(2) Paraphrase và QA thông thường đều bão hoà; thêm kiểu diễn đạt mới mới là cái đẩy điểm lên.</text>
<text x="500" y="510" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">(3) Dữ liệu tổng hợp cộng dồn với RAG, nên dùng cả hai kênh.</text>
<text x="500" y="538" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e" xml:space="preserve">Nguồn: arXiv 2508.09494 (Active Reading, bản task-specific; bản task-agnostic 63,3), arXiv 2409.07431 (EntiGraph).</text>
