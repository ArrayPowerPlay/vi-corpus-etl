<text x="500.0" y="58" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Cùng một lượng kiến thức, cách trình bày quyết định model học được bao nhiêu (số tiếng Anh, chưa có thí nghiệm tiếng Việt)</text>
