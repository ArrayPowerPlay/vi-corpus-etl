<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 839" width="1100" height="839" font-family="DejaVu Sans, Arial, sans-serif">
<title>Dữ liệu SFT: nguồn theo mức quyền → KU hội thoại → chọn + trộn</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1100" height="839" fill="#ffffff"/>
<text x="550.0" y="34.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733" xml:space="preserve">Dữ liệu SFT: nguồn theo mức quyền → KU hội thoại → chọn + trộn</text>
<text x="550.0" y="58.0" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Bên phải: luồng sinh SFT có căn cứ từ corpus (tuỳ chọn), chỉ chạy hàng loạt sau cổng đọc tay</text>
<rect x="40" y="80" width="16" height="16" rx="3" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="62.0" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã có, đã chạy</text>
<rect x="188.8" y="80" width="16" height="16" rx="3" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="210.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã code, chưa đo trên server</text>
<rect x="438.4" y="80" width="16" height="16" rx="3" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="460.4" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đề xuất mới</text>
<rect x="565.6" y="80" width="16" height="16" rx="3" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="587.6" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tuỳ chọn</text>
<rect x="671.2" y="80" width="16" height="16" rx="3" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="693.2" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cổng kiểm tra / đo</text>
<rect x="848.8000000000001" y="80" width="16" height="16" rx="3" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="870.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cần chốt</text>
<text x="180.0" y="124.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Nguồn (mức quyền)</text>
<rect x="30" y="130" width="300" height="69" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="180.0" y="152.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">XANH · SEA-Instruct-2602 vi</text>
<text x="180.0" y="169.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">ODC-By, câu trả lời do model mở sinh; ~20</text>
<text x="180.0" y="184.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">cột nhãn</text>
<rect x="30" y="209" width="300" height="54" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="180.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">XANH · Aya (phần tiếng Việt)</text>
<text x="180.0" y="248.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">người viết, giấy phép mở</text>
<rect x="30" y="273" width="300" height="69" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="180.0" y="295.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">XANH · An toàn tiếng Việt</text>
<text x="180.0" y="312.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">dịch CÂU HỎI WildGuardMix / CoCoNot, sinh</text>
<text x="180.0" y="327.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">câu trả lời mới</text>
<rect x="30" y="352" width="300" height="69" rx="8" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="180.0" y="374.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">XANH · Dựng từ corpus</text>
<text x="180.0" y="391.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">mở sách (grounded_open) / đóng sách</text>
<text x="180.0" y="406.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">(closed_book)</text>
<rect x="30" y="431" width="300" height="54" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="180.0" y="453.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">VÀNG · có output GPT / Gemini</text>
<text x="180.0" y="470.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">chỉ dùng cho thí nghiệm (K-03)</text>
<rect x="30" y="495" width="300" height="54" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="180.0" y="517.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">ĐỎ · NC hoặc không giấy phép</text>
<text x="180.0" y="534.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">không dùng (Bactrian-X NC…)</text>
<rect x="400" y="130" width="300" height="101" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="550.0" y="152.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">KU SFT = 1 hội thoại nguyên vẹn</text>
<text x="550.0" y="169.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">(L-04)</text>
<text x="550.0" y="186.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">messages (system / user / assistant / tool)</text>
<text x="550.0" y="201.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">mode think, loss_turns, task, origin,</text>
<text x="550.0" y="216.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">generator_model, rights_tier, split_bucket</text>
<line x1="330.0" y1="164.5" x2="400.0" y2="164.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="330.0" y1="236.0" x2="400.0" y2="221.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="330.0" y1="307.5" x2="400.0" y2="221.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="330.0" y1="386.5" x2="400.0" y2="221.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="330.0" y1="458.0" x2="400.0" y2="221.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<rect x="400" y="257" width="300" height="69" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="550.0" y="279.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Dedup theo câu hỏi đầu tiên</text>
<text x="550.0" y="296.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">exact + MinHash, ưu tiên gốc Việt &gt; SEA &gt;</text>
<text x="550.0" y="311.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">corpus &gt; dịch</text>
<line x1="550.0" y1="231.0" x2="550.0" y2="257.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="400" y="352" width="300" height="84" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="550.0" y="374.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Quét nhiễm (L-01)</text>
<text x="550.0" y="391.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">8-gram trên lượt người dùng + hàng xóm ngữ</text>
<text x="550.0" y="406.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">nghĩa</text>
<text x="550.0" y="421.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">khác ngôn ngữ → judge phán</text>
<line x1="550.0" y1="326.0" x2="550.0" y2="352.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="400" y="462" width="300" height="54" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="550.0" y="484.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Chọn đa dạng theo cụm embedding</text>
<text x="550.0" y="501.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">luôn so với chọn ngẫu nhiên cùng số mẫu</text>
<line x1="550.0" y1="436.0" x2="550.0" y2="462.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="400" y="542" width="300" height="54" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="550.0" y="564.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Trộn theo tỉ lệ tác vụ</text>
<text x="550.0" y="581.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">xem thanh bên dưới</text>
<line x1="550.0" y1="516.0" x2="550.0" y2="542.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="400" y="622" width="300" height="69" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="550.0" y="644.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Render chat template của base (L-09)</text>
<text x="550.0" y="661.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Qwen3: khối think rỗng, tách lượt hoặc</text>
<text x="550.0" y="676.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">loss chỉ lượt cuối</text>
<line x1="550.0" y1="596.0" x2="550.0" y2="622.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="920.0" y="124.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">SFT tổng hợp có căn cứ (L-08)</text>
<rect x="770" y="136" width="300" height="84" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="920.0" y="158.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">1. Chọn đoạn nguồn</text>
<text x="920.0" y="175.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">1 đoạn / họ trùng, tầng cao, không cờ OCR</text>
<text x="920.0" y="190.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">xấu,</text>
<text x="920.0" y="205.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">phân tầng theo cụm + ngành / tạp chí</text>
<rect x="770" y="238" width="300" height="69" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="920.0" y="260.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">2. Sinh có điều kiện</text>
<text x="920.0" y="277.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">loại câu hỏi, độ sâu 1–3, persona Việt,</text>
<text x="920.0" y="292.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">bắt buộc trích câu bằng chứng</text>
<line x1="920.0" y1="220.0" x2="920.0" y2="238.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="770" y="325" width="300" height="54" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="920.0" y="347.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">3a. Lọc luật (CPU)</text>
<text x="920.0" y="364.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">câu hỏi tự đứng được, độ dài, ngôn ngữ</text>
<line x1="920.0" y1="307.0" x2="920.0" y2="325.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="770" y="397" width="300" height="54" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="920.0" y="419.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">3b. Căn cứ rẻ (CPU)</text>
<text x="920.0" y="436.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">số, năm, tên riêng phải có trong đoạn</text>
<line x1="920.0" y1="379.0" x2="920.0" y2="397.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="770" y="469" width="300" height="54" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="920.0" y="491.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">3c. Judge khác họ + hỏi lại</text>
<text x="920.0" y="508.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">kiểm từng ý có / không</text>
<line x1="920.0" y1="451.0" x2="920.0" y2="469.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="770" y="541" width="300" height="54" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="920.0" y="563.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">3d. Dedup ngữ nghĩa câu hỏi</text>
<text x="920.0" y="580.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Qwen3-Embedding</text>
<line x1="920.0" y1="523.0" x2="920.0" y2="541.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="770" y="613" width="300" height="54" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="920.0" y="635.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">4. Đọc tay 200 mẫu / nguồn</text>
<text x="920.0" y="652.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">cổng: ≥ 90% bám nguồn (K-13)</text>
<line x1="920.0" y1="595.0" x2="920.0" y2="613.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="770,640.0 735,640.0 735,176.0 700,176.0" fill="none" stroke="#455566" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="30.0" y="733.0" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Tỉ lệ tác vụ khởi điểm cho SFT (phỏng theo Tulu 3, chỉnh theo T-04; chốt ở K-17 / E-02)</text>
