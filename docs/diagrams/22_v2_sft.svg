<rect x="711.4" y="776" width="12" height="12" rx="2" fill="#7b4fc4"/>
<text x="729.4" y="787.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Ràng buộc định dạng 8%</text>
