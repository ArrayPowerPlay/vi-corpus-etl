<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" width="1040" height="890" font-family="DejaVu Sans, Arial, sans-serif">
<title>Huấn luyện thử: CPT trên base → chat vector → SFT → RAG, cổng eval ở mọi checkpoint</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1040" height="890" fill="#ffffff"/>
<text x="520.0" y="34.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733" xml:space="preserve">Huấn luyện thử: CPT trên base → chat vector → SFT → RAG, cổng eval ở mọi checkpoint</text>
<text x="520.0" y="58.0" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Mục tiêu: tăng kiến thức tiếng Việt mà không tụt chỉ thị / toán / code (T-04, W6: ≤ 1 điểm)</text>
<rect x="40" y="80" width="16" height="16" rx="3" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="62.0" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã có, đã chạy</text>
<rect x="188.8" y="80" width="16" height="16" rx="3" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="210.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã code, chưa đo trên server</text>
<rect x="438.4" y="80" width="16" height="16" rx="3" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="460.4" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đề xuất mới</text>
<rect x="565.6" y="80" width="16" height="16" rx="3" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="587.6" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tuỳ chọn</text>
<rect x="671.2" y="80" width="16" height="16" rx="3" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="693.2" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cổng kiểm tra / đo</text>
<rect x="848.8000000000001" y="80" width="16" height="16" rx="3" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="870.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cần chốt</text>
<rect x="300" y="120" width="420" height="55" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="510.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Base + instruct gốc cùng họ (K-15)</text>
<text x="510.0" y="159.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">ví dụ Qwen3-1.7B-Base và Qwen3-1.7B</text>
<rect x="300" y="205" width="420" height="71" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="510.0" y="227.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Bước 0 · đo base</text>
<text x="510.0" y="244.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">Known / Unknown, điểm gốc mọi bộ, perplexity Việt sau</text>
<text x="510.0" y="260.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">200 bước thử</text>
<rect x="300" y="306" width="420" height="87" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="510.0" y="328.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">CPT pha ổn định (WSD)</text>
<text x="510.0" y="345.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">full fine-tune, AdamW, LR quét ở E-07; batch 256K–1M</text>
<text x="510.0" y="361.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">token</text>
<text x="510.0" y="377.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">web Việt + nguồn tốt lượt 1 + replay</text>
<rect x="300" y="423" width="420" height="71" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="510.0" y="445.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Lưu checkpoint trước khi hạ LR</text>
<text x="510.0" y="462.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">để nối tiếp khi có dữ liệu mới, và để mở nhiều nhánh</text>
<text x="510.0" y="478.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">decay</text>
<rect x="300" y="524" width="420" height="55" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="510.0" y="546.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">CPT pha decay (10–20% cuối)</text>
<text x="510.0" y="563.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">nguồn tốt lượt 2 + chỉ thị ~10% + replay toán / code</text>
<rect x="300" y="609" width="420" height="71" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="510.0" y="631.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Cộng chat vector</text>
<text x="510.0" y="648.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">M = CPT_base + α × (Instruct − Base), quét α 0,5 / 0,75</text>
<text x="510.0" y="664.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">/ 1,0</text>
<rect x="300" y="710" width="420" height="71" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="510.0" y="732.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">SFT</text>
<text x="510.0" y="749.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">full cho ≤ 4B, LoRA r 64–256 cho 8B; LR 5e-6…2e-5, 2</text>
<text x="510.0" y="765.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">epoch</text>
<rect x="300" y="811" width="420" height="55" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="510.0" y="833.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">RAG trên kho chunk đã nhúng</text>
<text x="510.0" y="850.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cho sự kiện hiếm (xuất hiện &lt; 10 lần)</text>
<line x1="510.0" y1="175.0" x2="510.0" y2="205.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="510.0" y1="276.0" x2="510.0" y2="306.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="510.0" y1="393.0" x2="510.0" y2="423.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="510.0" y1="494.0" x2="510.0" y2="524.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="510.0" y1="579.0" x2="510.0" y2="609.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="510.0" y1="680.0" x2="510.0" y2="710.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="510.0" y1="781.0" x2="510.0" y2="811.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="760" y="518" width="250" height="69" rx="8" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="885.0" y="540.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Soup 2–3 lượt decay</text>
<text x="885.0" y="557.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">khác seed / thứ tự, lấy trung bình</text>
<text x="885.0" y="572.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">trọng số</text>
<line x1="720.0" y1="551.5" x2="760.0" y2="551.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="306" width="240" height="86" rx="8" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="150.0" y="328.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Nhánh N5: bắt đầu từ</text>
<text x="150.0" y="345.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">instruct</text>
<text x="150.0" y="362.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">CPT trộn chỉ thị tự sinh, không</text>
<text x="150.0" y="377.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">cần chat vector (E-11)</text>
<line x1="270.0" y1="349.0" x2="300.0" y2="349.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<rect x="30" y="599" width="240" height="84" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="150.0" y="621.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Chống quên (7 lớp)</text>
<text x="150.0" y="638.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">CPT trên base, LR quét, replay</text>
<text x="150.0" y="653.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">25–30%, chỉ thị trong decay, chat</text>
<text x="150.0" y="668.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">vector, SFT ngắn, cổng eval</text>
<rect x="760" y="302" width="250" height="54" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="885.0" y="324.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">BPB held-out theo nguồn</text>
<text x="885.0" y="341.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">mỗi ~100–200M token</text>
<line x1="720.0" y1="349.5" x2="760.0" y2="329.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<rect x="760" y="419" width="250" height="71" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="885.0" y="441.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Kiến thức Việt (cloze / log-</text>
<text x="885.0" y="458.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">prob)</text>
<text x="885.0" y="475.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">VMLU, ViLLM-Eval, VNHSGE</text>
<line x1="720.0" y1="458.5" x2="760.0" y2="454.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<rect x="760" y="605" width="250" height="69" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="885.0" y="627.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Cổng không tụt (sau merge)</text>
<text x="885.0" y="644.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">IFEval + SEA-IFEval, GSM8K,</text>
<text x="885.0" y="659.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">HumanEval+ gộp MBPP+</text>
<line x1="720.0" y1="644.5" x2="760.0" y2="639.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
<rect x="760" y="706" width="250" height="69" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="885.0" y="728.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Eval A / B nội bộ</text>
<text x="885.0" y="745.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">H2 / H3; câu hỏi giữa + cuối tài</text>
<text x="885.0" y="760.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">liệu</text>
<line x1="720.0" y1="745.5" x2="760.0" y2="740.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
</svg>
