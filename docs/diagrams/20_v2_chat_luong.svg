<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 923" width="1000" height="923" font-family="DejaVu Sans, Arial, sans-serif">
<title>Chọn dữ liệu theo chất lượng: judge → bộ chấm nhỏ → xếp tầng</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="923" fill="#ffffff"/>
<text x="500.0" y="34.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733" xml:space="preserve">Chọn dữ liệu theo chất lượng: judge → bộ chấm nhỏ → xếp tầng</text>
<text x="500.0" y="58.0" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Rule vẫn là cổng chính cho lỗi OCR / font; điểm model dùng để xếp tầng và trộn theo trọng số, không bỏ cứng</text>
<rect x="40" y="80" width="16" height="16" rx="3" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="62.0" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã có, đã chạy</text>
<rect x="188.8" y="80" width="16" height="16" rx="3" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="210.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã code, chưa đo trên server</text>
<rect x="438.4" y="80" width="16" height="16" rx="3" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="460.4" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đề xuất mới</text>
<rect x="565.6" y="80" width="16" height="16" rx="3" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="587.6" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tuỳ chọn</text>
<rect x="671.2" y="80" width="16" height="16" rx="3" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="693.2" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cổng kiểm tra / đo</text>
<rect x="848.8000000000001" y="80" width="16" height="16" rx="3" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="870.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cần chốt</text>
<rect x="300" y="120" width="400" height="55" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="500.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Đoạn còn sống sau dedup vòng 2</text>
<text x="500.0" y="159.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">~1.024 token mỗi đoạn, mang lineage + dedup_family_id</text>
<rect x="300" y="209" width="400" height="55" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="500.0" y="231.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Rule + band A–D (có sẵn)</text>
<text x="500.0" y="248.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mã cứng: garbled_font, lost_letters, too_short…</text>
<line x1="500.0" y1="175.0" x2="500.0" y2="209.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="300" y="298" width="400" height="55" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="320.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Lấy mẫu 50.000 đoạn (R-11)</text>
<text x="500.0" y="337.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">phân tầng theo nguồn × band, lấy trước khi lọc gắt</text>
<line x1="500.0" y1="264.0" x2="500.0" y2="298.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="300" y="387" width="400" height="71" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="409.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">LLM judge nội bộ (Qwen3.5-27B)</text>
<text x="500.0" y="426.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">thang cộng dồn 5 tiêu chí (0–5)</text>
<text x="500.0" y="442.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">+ cờ vn_specific, factual_news, domain, lỗi</text>
<line x1="500.0" y1="353.0" x2="500.0" y2="387.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="740" y="377" width="230" height="114" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="855.0" y="399.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Kiểm judge (E-13)</text>
<text x="855.0" y="416.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">FineWeb-C tiếng Việt: 2.869 nhãn</text>
<text x="855.0" y="431.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">người</text>
<text x="855.0" y="446.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">chấm lại 1.000 mẫu, prompt Việt</text>
<text x="855.0" y="461.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">/ Anh</text>
<text x="855.0" y="476.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Spearman theo từng nguồn</text>
<line x1="700.0" y1="422.5" x2="740.0" y2="422.5" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="60" y="498" width="270" height="55" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="195.0" y="520.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">① fastText</text>
<text x="195.0" y="537.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">mốc rẻ, CPU vài phút</text>
<rect x="365" y="498" width="270" height="71" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="520.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">② Đầu MLP trên Qwen3-Embedding</text>
<text x="500.0" y="537.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">bộ chấm chính; chỉ dạy đầu, không</text>
<text x="500.0" y="553.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">fine-tune</text>
<rect x="670" y="498" width="270" height="71" rx="8" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="805.0" y="520.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">③ Bộ 2 kiểu FineWeb2-HQ</text>
<text x="805.0" y="537.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">dương = hỏi–đáp kiến thức Việt; tuỳ</text>
<text x="805.0" y="553.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">chọn</text>
<polyline points="500.0,458.0 500.0,478.0 195.0,478.0 195.0,498.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="500.0,458.0 500.0,478.0 500.0,478.0 500.0,498.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="500.0,458.0 500.0,478.0 805.0,478.0 805.0,498.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="250" y="609" width="500" height="71" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="500.0" y="631.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Ensemble kiểu Nemotron-CC</text>
<text x="500.0" y="648.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đổi mỗi điểm sang hạng phân vị TRONG từng nguồn, lấy max (giữ được</text>
<text x="500.0" y="664.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">nhiều token tốt)</text>
<polyline points="195.0,553.0 195.0,581.0 500.0,581.0 500.0,609.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="500.0,569.0 500.0,589.0 500.0,589.0 500.0,609.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="805.0,569.0 805.0,589.0 500.0,589.0 500.0,609.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="140.0" y="718.0" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Xếp tầng phần web (tỉ lệ minh hoạ theo Nemotron-CC; sách / giáo trình / VJOL chỉ bỏ ~5% thấp nhất)</text>
<rect x="140.0" y="726" width="180.0" height="30" fill="#2a78d6" stroke="#ffffff"/>
<text x="230.0" y="745.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">25%</text>
<rect x="320.0" y="726" width="324.0" height="30" fill="#3f9b6b" stroke="#ffffff"/>
<text x="482.0" y="745.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">45%</text>
<rect x="644.0" y="726" width="144.0" height="30" fill="#c98a1a" stroke="#ffffff"/>
<text x="716.0" y="745.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">20%</text>
<rect x="788.0" y="726" width="72.0" height="30" fill="#c4503f" stroke="#ffffff"/>
<text x="824.0" y="745.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" xml:space="preserve">10%</text>
<rect x="140.0" y="763" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="158.0" y="774.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Cao: lặp 2 lần 25%</text>
<rect x="298.8" y="763" width="12" height="12" rx="2" fill="#3f9b6b"/>
<text x="316.8" y="774.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">TB: 1 lần 45%</text>
<rect x="424.6" y="763" width="12" height="12" rx="2" fill="#c98a1a"/>
<text x="442.6" y="774.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">TB-thấp: chỉ khi thiếu token 20%</text>
<rect x="675.8" y="763" width="12" height="12" rx="2" fill="#c4503f"/>
<text x="693.8" y="774.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Thấp: bỏ 10%</text>
<rect x="250" y="812" width="500" height="87" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="500.0" y="834.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Proxy kiểm bộ lọc (E-09)</text>
<text x="500.0" y="851.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">CPT ngắn Qwen3-0.6B base, 4 nhánh × 2 seed, cùng số token và cùng</text>
<text x="500.0" y="867.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">số lần lặp</text>
<text x="500.0" y="883.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đo bằng xác suất đáp án đúng trên benchmark Việt, không bằng mắt</text>
<line x1="500.0" y1="786.0" x2="500.0" y2="812.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
