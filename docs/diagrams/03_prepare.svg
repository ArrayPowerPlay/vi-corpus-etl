<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1057" width="1000" height="1057" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 3: prepare (chuẩn hoá, xoá dòng lặp, cắt đoạn, đếm token)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="1057" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 3: prepare (chuẩn hoá, xoá dòng lặp, cắt đoạn, đếm token)</text>
<text x="500.0" y="50" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#6a7a8a">vi_corpus/pipeline/normalize.py · lines.py · chunk.py · tokens.py</text>
<rect x="30" y="70" width="620" height="30" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="42" y="92" font-size="14" font-weight="700" fill="#1b2733">01_ingest.parquet</text>
<rect x="30" y="130" width="620" height="139" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="152" font-size="14" font-weight="700" fill="#1b2733">normalize_text (NORMALIZER_VERSION 4)</text>
<text x="42" y="169.5" font-size="12" fill="#1b2733" xml:space="preserve">CRLF → LF, Unicode NFC; bỏ ký tự điều khiển và vô hình (zero-width, BOM, soft</text>
<text x="42" y="186.0" font-size="12" fill="#1b2733" xml:space="preserve">hyphen); mọi khoảng trắng Unicode → dấu cách; gộp dấu cách và dòng trống thừa.</text>
<text x="42" y="202.5" font-size="12" fill="#1b2733" xml:space="preserve">&#x27;ƣ&#x27; → &#x27;ư&#x27; (phông Việt cũ); ký tự vùng riêng của font Symbol → Unicode. Văn bản có</text>
<text x="42" y="219.0" font-size="12" fill="#1b2733" xml:space="preserve">code giữ thụt lề đầu dòng (C-09).</text>
<text x="42" y="235.5" font-size="12" fill="#1b2733" xml:space="preserve">Không sửa nội dung (không paraphrase, không sửa số liệu / tên); source_sha256 vẫn là</text>
<text x="42" y="252.0" font-size="12" fill="#1b2733" xml:space="preserve">của text gốc.</text>
<rect x="30" y="290" width="620" height="122" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="312" font-size="14" font-weight="700" fill="#1b2733">lines.clean_rows: xoá dòng lặp (LINES_VERSION 6)</text>
<text x="42" y="329.5" font-size="12" fill="#1b2733" xml:space="preserve">A. Trong văn bản: gộp dòng giống nhau liền nhau; dòng ngắn lặp ≥ 3 lần chỉ giữ lần</text>
<text x="42" y="346.0" font-size="12" fill="#1b2733" xml:space="preserve">đầu; bỏ dòng số trang. Miễn cho văn bản có code / bảng và SEA-Instruct.</text>
<text x="42" y="362.5" font-size="12" fill="#1b2733" xml:space="preserve">B. Tiêu đề / chân trang sách: đã làm lúc ingest (clean_pages).</text>
<text x="42" y="379.0" font-size="12" fill="#1b2733" xml:space="preserve">C. Liên văn bản, chỉ nguồn web: xoá dòng có ở ≥ max(20; 0,01%) số văn bản của nguồn</text>
<text x="42" y="395.5" font-size="12" fill="#1b2733" xml:space="preserve">(menu, chân trang).</text>
<rect x="30" y="460" width="620" height="73" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="482" font-size="14" font-weight="700" fill="#1b2733">Cần cắt đoạn?</text>
<text x="42" y="499.5" font-size="12" fill="#1b2733" xml:space="preserve">nguồn chunked (stbook, giáo trình, VJOL, VISTA): luôn cắt; bài web: chỉ khi &gt; 2.048</text>
<text x="42" y="516.0" font-size="12" fill="#1b2733" xml:space="preserve">token; hội thoại SEA-Instruct: không cắt.</text>
<rect x="30" y="550" width="620" height="156" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="572" font-size="14" font-weight="700" fill="#1b2733">chunk_rows (CHUNK_VERSION 5)</text>
<text x="42" y="589.5" font-size="12" fill="#1b2733" xml:space="preserve">gắn doc_sha256 và doc_minhash của CẢ văn bản gốc (dedup chạy theo văn bản, R-19).</text>
<text x="42" y="606.0" font-size="12" fill="#1b2733" xml:space="preserve">cắt theo token Qwen3: mục tiêu 1.024, tối đa 2.048; đoạn cuối &lt; 256 gộp vào trước,</text>
<text x="42" y="622.5" font-size="12" fill="#1b2733" xml:space="preserve">không gộp được thì mượn các đoạn văn cuối của đoạn trước.</text>
<text x="42" y="639.0" font-size="12" fill="#1b2733" xml:space="preserve">chỗ cắt ưu tiên: dòng tiêu đề (Chương, Bài, Mục...) → dòng trống → hết câu → cắt cứng</text>
<text x="42" y="655.5" font-size="12" fill="#1b2733" xml:space="preserve">chia đều.</text>
<text x="42" y="672.0" font-size="12" fill="#1b2733" xml:space="preserve">doc_id = &lt;doc&gt;#c&lt;i&gt;, parent_doc_id, chunk_index; mỗi đoạn giữ source_path /</text>
<text x="42" y="688.5" font-size="12" fill="#1b2733" xml:space="preserve">source_sha256 của văn bản gốc.</text>
<rect x="30" y="730" width="620" height="90" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="752" font-size="14" font-weight="700" fill="#1b2733">Nguồn chunked và không --take-all?</text>
<text x="42" y="769.5" font-size="12" fill="#1b2733" xml:space="preserve">có: lấy mẫu đoạn theo băm (seed, nguồn, parent_doc_id, chunk_index) xuống</text>
<text x="42" y="786.0" font-size="12" fill="#1b2733" xml:space="preserve">cfg.mix[nguồn], nên sửa một bài không đổi đoạn được chọn của bài khác. --take-all:</text>
<text x="42" y="802.5" font-size="12" fill="#1b2733" xml:space="preserve">giữ hết.</text>
<rect x="30" y="830" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="852" font-size="14" font-weight="700" fill="#1b2733">set_counts</text>
<text x="42" y="869.5" font-size="12" fill="#1b2733" xml:space="preserve">char_count, word_count, token_count bằng tokenizer thật (mặc định hf:Qwen/Qwen3-0.6B,</text>
<text x="42" y="886.0" font-size="12" fill="#1b2733" xml:space="preserve">đếm theo lô; --tokenizer words chỉ để thử, thấp hơn token thật ~1,37 lần).</text>
<rect x="30" y="920" width="620" height="73" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="942" font-size="14" font-weight="700" fill="#1b2733">02_prepare.parquet</text>
<text x="42" y="959.5" font-size="12" fill="#1b2733" xml:space="preserve">manifest: normalize, lines (kèm 30 dòng bị xoá nhiều nhất mỗi nguồn), chunk (số sách,</text>
<text x="42" y="976.0" font-size="12" fill="#1b2733" xml:space="preserve">số đoạn trước / sau lấy mẫu).</text>
