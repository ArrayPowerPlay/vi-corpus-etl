<polyline points="340.0,269.0 340.0,290.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,412.5 340.0,460.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,533.0 340.0,550.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="344.0" y="530.5" width="18.8" height="15" fill="#ffffff" opacity="0.9"/>
<text x="346.0" y="541.5" text-anchor="start" font-size="11.5" fill="#455566">có</text>
<polyline points="340.0,705.5 340.0,730.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,819.5 340.0,830.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,903.0 340.0,920.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="690" y="460" width="280" height="73" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="702" y="482" font-size="14" font-weight="700" fill="#1b2733">Không cắt</text>
<text x="702" y="499.5" font-size="12" fill="#1b2733" xml:space="preserve">bản ghi đi thẳng tới bước đếm (bài</text>
<text x="702" y="516.0" font-size="12" fill="#1b2733" xml:space="preserve">web ngắn, hội thoại SFT).</text>
<polyline points="650.0,496.5 690.0,496.5" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="649.0" y="479.5" width="38.0" height="15" fill="#ffffff" opacity="0.9"/>
<text x="670.0" y="490.5" text-anchor="middle" font-size="11.5" fill="#455566">không</text>
<polyline points="830.0,533.0 830.0,866.5 650.0,866.5" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="1021" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="1032" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text>
<rect x="187" y="1021" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="211" y="1032" font-size="11.5" fill="#455566">bước xử lý (CPU)</text>
<rect x="337" y="1021" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="361" y="1032" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text>
<rect x="513" y="1021" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="537" y="1032" font-size="11.5" fill="#455566">đầu ra</text>
</svg>
