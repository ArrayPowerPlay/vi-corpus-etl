<text x="852" y="530" text-anchor="end" font-size="11" fill="#455566">mọi bản ghi, kể cả bị loại</text>
<line x1="140" y1="660" x2="140" y2="726" stroke="#455566" stroke-width="1.8"/>
<line x1="140" y1="726" x2="860" y2="726" stroke="#455566" stroke-width="1.8"/>
<line x1="140" y1="726" x2="140" y2="742" stroke="#455566" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="45" y="742" width="190" height="62" rx="9" fill="#dff5ea" stroke="#1baf7a" stroke-width="1.6"/>
<text x="140" y="762" text-anchor="middle" font-size="12" font-weight="700" font-family="DejaVu Sans Mono, Menlo, monospace" fill="#1b2733">clean.parquet</text>
<text x="140" y="781" text-anchor="middle" font-size="12" fill="#1b2733">bản ghi status = kept</text>
<text x="140" y="796" text-anchor="middle" font-size="12" fill="#1b2733">+ provenance, rights, band</text>
<line x1="380" y1="726" x2="380" y2="742" stroke="#455566" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="285" y="742" width="190" height="62" rx="9" fill="#dff5ea" stroke="#1baf7a" stroke-width="1.6"/>
<text x="380" y="762" text-anchor="middle" font-size="12" font-weight="700" font-family="DejaVu Sans Mono, Menlo, monospace" fill="#1b2733">knowledge_units.parquet</text>
<text x="380" y="781" text-anchor="middle" font-size="12" fill="#1b2733">CPT / SFT, split_bucket</text>
<text x="380" y="796" text-anchor="middle" font-size="12" fill="#1b2733">theo họ trùng (chưa chia)</text>
<line x1="620" y1="726" x2="620" y2="742" stroke="#455566" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="525" y="742" width="190" height="62" rx="9" fill="#dff5ea" stroke="#1baf7a" stroke-width="1.6"/>
<text x="620" y="762" text-anchor="middle" font-size="12" font-weight="700" font-family="DejaVu Sans Mono, Menlo, monospace" fill="#1b2733">audit.json</text>
<text x="620" y="781" text-anchor="middle" font-size="12" fill="#1b2733">lineage ≥ 95%, funnel,</text>
<text x="620" y="796" text-anchor="middle" font-size="12" fill="#1b2733">token, PII (rò rỉ: chưa chạy)</text>
<line x1="860" y1="726" x2="860" y2="742" stroke="#455566" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="765" y="742" width="190" height="62" rx="9" fill="#dff5ea" stroke="#1baf7a" stroke-width="1.6"/>
<text x="860" y="762" text-anchor="middle" font-size="12" font-weight="700" font-family="DejaVu Sans Mono, Menlo, monospace" fill="#1b2733">report.html + viz/</text>
<text x="860" y="781" text-anchor="middle" font-size="12" fill="#1b2733">bản đồ embedding,</text>
<text x="860" y="796" text-anchor="middle" font-size="12" fill="#1b2733">phân phối chất lượng</text>
