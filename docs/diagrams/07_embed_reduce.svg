<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 859" width="1000" height="859" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 7: embed → reduce → bản đồ embedding</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="859" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 7: embed → reduce → bản đồ embedding</text>
<text x="500.0" y="50" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#6a7a8a">vi_corpus/pipeline/embed.py · reduce.py · viz.py</text>
<rect x="30" y="70" width="620" height="30" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="42" y="92" font-size="14" font-weight="700" fill="#1b2733">05_dedup.parquet (mọi bản ghi, hoặc chỉ bản giữ lại nếu --embed-scope kept)</text>
<rect x="30" y="130" width="620" height="73" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="42" y="152" font-size="14" font-weight="700" fill="#1b2733">Chạy khi cfg.embed_spec khác None</text>
<text x="42" y="169.5" font-size="12" fill="#1b2733" xml:space="preserve">--embedder none (bản chạy cả kho VJOL / VISTA, K-07 chờ chốt) thì bỏ qua cả embed và</text>
<text x="42" y="186.0" font-size="12" fill="#1b2733" xml:space="preserve">reduce, report không có bản đồ.</text>
<rect x="30" y="235" width="300" height="122" rx="8" fill="#e8e4fb" stroke="#6b4fd0" stroke-width="1.6"/>
<text x="42" y="257" font-size="14" font-weight="700" fill="#1b2733">hf:&lt;model&gt;</text>
<text x="320" y="255" text-anchor="end" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#455566">Ray</text>
<text x="42" y="274.5" font-size="12" fill="#1b2733" xml:space="preserve">mặc định intfloat/multilingual-e5-base</text>
<text x="42" y="291.0" font-size="12" fill="#1b2733" xml:space="preserve">(tiền tố &#x27;passage: &#x27;, cắt 6.000 ký tự,</text>
<text x="42" y="307.5" font-size="12" fill="#1b2733" xml:space="preserve">≤ 512 token), mean pooling + chuẩn hoá</text>
<text x="42" y="324.0" font-size="12" fill="#1b2733" xml:space="preserve">L2; fp16 trên GPU. Mỗi actor Curator</text>
<text x="42" y="340.5" font-size="12" fill="#1b2733" xml:space="preserve">giữ 1 bản mô hình trên 1 GPU.</text>
<rect x="350" y="235" width="300" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="362" y="257" font-size="14" font-weight="700" fill="#1b2733">tfidf</text>
<text x="362" y="274.5" font-size="12" fill="#1b2733" xml:space="preserve">TF-IDF + SVD 64 chiều, CPU, fit trên</text>
<text x="362" y="291.0" font-size="12" fill="#1b2733" xml:space="preserve">toàn corpus nên chạy tuần tự; dùng khi</text>
<text x="362" y="307.5" font-size="12" fill="#1b2733" xml:space="preserve">thử không GPU.</text>
<rect x="30" y="420" width="620" height="56" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="442" font-size="14" font-weight="700" fill="#1b2733">06_embeddings.parquet</text>
<text x="42" y="459.5" font-size="12" fill="#1b2733" xml:space="preserve">(doc_id, embedding float32)</text>
<rect x="30" y="490" width="620" height="106" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="512" font-size="14" font-weight="700" fill="#1b2733">reduce_embeddings</text>
<text x="42" y="529.5" font-size="12" fill="#1b2733" xml:space="preserve">HDBSCAN chạy trên embedding GỐC (hoặc pca50 / umap10 qua --cluster-space),</text>
<text x="42" y="546.0" font-size="12" fill="#1b2733" xml:space="preserve">min_cluster_size mặc định max(2, min(20, n / 10)); -1 = nhiễu.</text>
<text x="42" y="562.5" font-size="12" fill="#1b2733" xml:space="preserve">PCA 2D và UMAP 2D chỉ để vẽ (cuML nếu có GPU, không thì scikit-learn / umap-learn);</text>
<text x="42" y="579.0" font-size="12" fill="#1b2733" xml:space="preserve">fit MỘT lần trên toàn ma trận.</text>
<rect x="30" y="625" width="620" height="73" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="647" font-size="14" font-weight="700" fill="#1b2733">07_reduced.parquet</text>
<text x="42" y="664.5" font-size="12" fill="#1b2733" xml:space="preserve">doc_id, pca_x, pca_y, umap_x, umap_y, cluster_id; manifest ghi số cụm, tỉ lệ nhiễu,</text>
<text x="42" y="681.0" font-size="12" fill="#1b2733" xml:space="preserve">tham số.</text>
<rect x="30" y="722" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="744" font-size="14" font-weight="700" fill="#1b2733">build_embedding_section (viz.py)</text>
<text x="42" y="761.5" font-size="12" fill="#1b2733" xml:space="preserve">plotly scattergl, nhúng một lần vào report.html; chọn UMAP / PCA × tô theo nguồn,</text>
<text x="42" y="778.0" font-size="12" fill="#1b2733" xml:space="preserve">trạng thái, band, ngôn ngữ, cụm; rê chuột xem đoạn đầu + reason code.</text>
<rect x="690" y="490" width="280" height="106" rx="8" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="702" y="512" font-size="14" font-weight="700" fill="#6a6a6a">Giới hạn chưa gỡ</text>
<text x="702" y="529.5" font-size="12" fill="#6a6a6a" xml:space="preserve">fit trên mẫu phân tầng và Datashader</text>
<text x="702" y="546.0" font-size="12" fill="#6a6a6a" xml:space="preserve">khi &gt; 100k điểm; HDBSCAN</text>
<text x="702" y="562.5" font-size="12" fill="#6a6a6a" xml:space="preserve">scikit-learn không scale tới hàng</text>
<text x="702" y="579.0" font-size="12" fill="#6a6a6a" xml:space="preserve">triệu đoạn.</text>
<polyline points="340.0,100.0 340.0,130.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,476.5 340.0,490.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,596.0 340.0,625.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,698.0 340.0,722.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="180.0,203.0 180.0,235.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="500.0,203.0 500.0,235.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="180.0,357.5 180.0,420.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="500.0,324.5 500.0,420.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="823" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="834" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text>
<rect x="187" y="823" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="211" y="834" font-size="11.5" fill="#455566">bước xử lý (CPU)</text>
<rect x="337" y="823" width="18" height="14" rx="3" fill="#e8e4fb" stroke="#6b4fd0"/><text x="361" y="834" font-size="11.5" fill="#455566">bước chạy trên GPU</text>
<rect x="500" y="823" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="524" y="834" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text>
<rect x="676" y="823" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="700" y="834" font-size="11.5" fill="#455566">đầu ra</text>
<rect x="763" y="823" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="787" y="834" font-size="11.5" fill="#455566">chưa có code</text>
</svg>
