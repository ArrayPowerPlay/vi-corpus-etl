<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 838" width="1000" height="838" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 9: chạy song song bằng NeMo Curator + Ray</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="838" fill="#ffffff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 9: chạy song song bằng NeMo Curator + Ray</text>
<text x="500.0" y="58" text-anchor="middle" font-size="12" fill="#52514e">vi_corpus/pipeline/curator.py · vi_corpus/stbook/ocr_parallel.py</text>
<rect x="30" y="84" width="530" height="28" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="42" y="106" font-size="14" font-weight="700" fill="#1b2733">rows: list[dict] (trong driver)</text>
<line x1="295.0" y1="112" x2="295.0" y2="150" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="152" width="530" height="85" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="174" font-size="14" font-weight="700" fill="#1b2733">encode_rows → phân vùng</text>
<text x="42" y="194" font-size="12" fill="#1b2733" xml:space="preserve">DataFrame 2 cột (doc_id, payload = JSON của cả hàng) để int / None / list giữ</text>
<text x="42" y="211" font-size="12" fill="#1b2733" xml:space="preserve">  kiểu</text>
<text x="42" y="228" font-size="12" fill="#1b2733" xml:space="preserve">chia thành DocumentBatch, ~rows_per_task hàng mỗi phân vùng</text>
<line x1="295.0" y1="237" x2="295.0" y2="275" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="277" width="530" height="68" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="299" font-size="14" font-weight="700" fill="#1b2733">init_ray trước MỖI stage</text>
<text x="42" y="319" font-size="12" fill="#1b2733" xml:space="preserve">executor Curator gọi ray.shutdown() sau mỗi pipeline.run</text>
<text x="42" y="336" font-size="12" fill="#1b2733" xml:space="preserve">→ khởi động lại Ray, bỏ RAY_ADDRESS cũ, giữ số GPU / CPU đã chọn</text>
<line x1="295.0" y1="345" x2="295.0" y2="383" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="385" width="530" height="51" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.5"/>
<text x="42" y="407" font-size="14" font-weight="700" fill="#1b2733">build_executor(--executor)</text>
<text x="42" y="427" font-size="12" fill="#1b2733" xml:space="preserve">xenna (mặc định, như ViLA) | ray_actor_pool | ray_data</text>
<line x1="295.0" y1="436" x2="295.0" y2="474" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="476" width="530" height="102" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="498" font-size="14" font-weight="700" fill="#1b2733">RowsStage trên mỗi actor</text>
<text x="42" y="518" font-size="12" fill="#1b2733" xml:space="preserve">setup(): factory() tạo hàm xử lý ngay trên actor (mô hình nạp lên GPU của</text>
<text x="42" y="535" font-size="12" fill="#1b2733" xml:space="preserve">  actor)</text>
<text x="42" y="552" font-size="12" fill="#1b2733" xml:space="preserve">process(): decode payload → hàm thuần (annotate_language / annotate_quality /</text>
<text x="42" y="569" font-size="12" fill="#1b2733" xml:space="preserve">  embed_rows / ocr_one_book) → encode lại</text>
<rect x="680" y="476" width="290" height="85" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="692" y="498" font-size="14" font-weight="700" fill="#1b2733">Resources</text>
<text x="692" y="518" font-size="12" fill="#1b2733" xml:space="preserve">language, quality: cpus</text>
<text x="692" y="535" font-size="12" fill="#1b2733" xml:space="preserve">embed: cpus=2, gpus</text>
<text x="692" y="552" font-size="12" fill="#1b2733" xml:space="preserve">OCR stbook: cpus=2, gpus (cuda)</text>
<line x1="560" y1="496" x2="678" y2="496" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="295.0" y1="578" x2="295.0" y2="616" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="618" width="530" height="51" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="42" y="640" font-size="14" font-weight="700" fill="#1b2733">Gom kết quả</text>
<text x="42" y="660" font-size="12" fill="#1b2733" xml:space="preserve">sắp lại theo doc_id đầu vào (executor không giữ thứ tự)</text>
<rect x="680" y="618" width="290" height="51" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.5"/>
<text x="692" y="640" font-size="14" font-weight="700" fill="#1b2733">RuntimeError</text>
<text x="692" y="660" font-size="12" fill="#1b2733" xml:space="preserve">executor làm rơi phân vùng</text>
<line x1="560" y1="638" x2="678" y2="638" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="620.0" y="632" text-anchor="middle" font-size="11.5" fill="#455566">số dòng lệch</text>
<line x1="295.0" y1="669" x2="295.0" y2="707" stroke="#455566" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="709" width="530" height="51" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="42" y="731" font-size="14" font-weight="700" fill="#1b2733">rows giống hệt chạy tuần tự</text>
<text x="42" y="751" font-size="12" fill="#1b2733" xml:space="preserve">kiểm bằng tests/test_curator.py (bỏ qua nếu chưa cài nemo-curator)</text>
<rect x="30" y="804" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="815" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text><rect x="185" y="804" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="209" y="815" font-size="11.5" fill="#455566">bước xử lý</text><rect x="291" y="804" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="315" y="815" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text><rect x="467" y="804" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="491" y="815" font-size="11.5" fill="#455566">loại / dừng</text><rect x="580" y="804" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="604" y="815" font-size="11.5" fill="#455566">đầu ra</text><rect x="658" y="804" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#9a9a9a" stroke-dasharray="4 3"/><text x="682" y="815" font-size="11.5" fill="#455566">dự kiến, chưa có code</text>
</svg>
