<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 773" width="1000" height="773" font-family="DejaVu Sans, Arial, sans-serif">
<title>Luồng con 4: language id (fastText lid.176, theo đoạn văn)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1000" height="773" fill="#ffffff"/>
<text x="500.0" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733">Luồng con 4: language id (fastText lid.176, theo đoạn văn)</text>
<text x="500.0" y="50" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#6a7a8a">vi_corpus/pipeline/language.py · spans.py</text>
<rect x="30" y="70" width="620" height="30" rx="8" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.6"/>
<text x="42" y="92" font-size="14" font-weight="700" fill="#1b2733">02_prepare.parquet</text>
<rect x="30" y="130" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="152" font-size="14" font-weight="700" fill="#1b2733">strip_math_code (từng lượt thoại riêng)</text>
<text x="42" y="169.5" font-size="12" fill="#1b2733" xml:space="preserve">bỏ khối ```, $$…$$, \[…\], \(…\), $…$ có ký hiệu toán trước khi nhận diện; số $$ lẻ</text>
<text x="42" y="186.0" font-size="12" fill="#1b2733" xml:space="preserve">thì không bỏ vùng nào.</text>
<rect x="30" y="230" width="620" height="90" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="252" font-size="14" font-weight="700" fill="#1b2733">Tách đoạn văn</text>
<text x="42" y="269.5" font-size="12" fill="#1b2733" xml:space="preserve">theo dòng trống (chỉ có một đoạn thì theo dòng); bỏ đoạn không có chữ cái hoặc &lt; 10</text>
<text x="42" y="286.0" font-size="12" fill="#1b2733" xml:space="preserve">chữ cái (trừ khi mọi đoạn đều ngắn); văn bản rất dài chỉ lấy tối đa lang_max_segments</text>
<text x="42" y="302.5" font-size="12" fill="#1b2733" xml:space="preserve">đoạn rải đều, mỗi đoạn tối đa 2.000 ký tự.</text>
<rect x="690" y="230" width="280" height="106" rx="8" fill="#fff4dc" stroke="#d19a1f" stroke-width="1.6"/>
<text x="702" y="252" font-size="14" font-weight="700" fill="#1b2733">Hội thoại SEA-Instruct</text>
<text x="702" y="269.5" font-size="12" fill="#1b2733" xml:space="preserve">bỏ lượt system và tiền tố vai;</text>
<text x="702" y="286.0" font-size="12" fill="#1b2733" xml:space="preserve">language / lang_score tính trên lượt</text>
<text x="702" y="302.5" font-size="12" fill="#1b2733" xml:space="preserve">người dùng; lang_mix trên mọi lượt;</text>
<text x="702" y="319.0" font-size="12" fill="#1b2733" xml:space="preserve">lang_answer cho phía trả lời.</text>
<polyline points="650.0,274.8 670.0,274.8 670.0,283.0 690.0,283.0" fill="none" stroke="#455566" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="30" y="360" width="620" height="106" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="382" font-size="14" font-weight="700" fill="#1b2733">Bộ nhận diện (cfg.lang_model)</text>
<text x="640" y="380" text-anchor="end" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="11" fill="#455566">Ray</text>
<text x="42" y="399.5" font-size="12" fill="#1b2733" xml:space="preserve">fasttext:lid.176 (mặc định): tải lid.176.bin một lần vào VI_CORPUS_MODEL_DIR hoặc</text>
<text x="42" y="416.0" font-size="12" fill="#1b2733" xml:space="preserve">~/.cache/vi_corpus; đoán từng đoạn → (nhãn ISO, độ tin cậy).</text>
<text x="42" y="432.5" font-size="12" fill="#1b2733" xml:space="preserve">heuristic: tỷ lệ chữ có dấu tiếng Việt + từ chức năng vi / en; chỉ để thử, không cần</text>
<text x="42" y="449.0" font-size="12" fill="#1b2733" xml:space="preserve">mạng.</text>
<rect x="30" y="500" width="620" height="73" rx="8" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.6"/>
<text x="42" y="522" font-size="14" font-weight="700" fill="#1b2733">Tổng hợp theo số CHỮ CÁI</text>
<text x="42" y="539.5" font-size="12" fill="#1b2733" xml:space="preserve">lang_mix = phần chữ cái của mỗi ngôn ngữ; language = ngôn ngữ nhiều nhất; lang_score</text>
<text x="42" y="556.0" font-size="12" fill="#1b2733" xml:space="preserve">= Σ(chữ cái × độ tin cậy) của đoạn thuộc language / tổng chữ cái.</text>
<rect x="690" y="500" width="280" height="106" rx="8" fill="#fdecea" stroke="#c94a3f" stroke-width="1.6"/>
<text x="702" y="522" font-size="14" font-weight="700" fill="#1b2733">Không còn chữ cái</text>
<text x="702" y="539.5" font-size="12" fill="#1b2733" xml:space="preserve">language = und, lang_score = 0,</text>
<text x="702" y="556.0" font-size="12" fill="#1b2733" xml:space="preserve">lang_mix = {} (stage quality gắn</text>
<text x="702" y="572.5" font-size="12" fill="#1b2733" xml:space="preserve">lang_unknown, không loại vì ngôn</text>
<text x="702" y="589.0" font-size="12" fill="#1b2733" xml:space="preserve">ngữ).</text>
<polyline points="650.0,536.5 670.0,536.5 670.0,553.0 690.0,553.0" fill="none" stroke="#455566" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="642.2" y="519.5" width="31.6" height="15" fill="#ffffff" opacity="0.9"/>
<text x="660.0" y="530.5" text-anchor="middle" font-size="11.5" fill="#455566">rỗng</text>
<rect x="30" y="620" width="620" height="90" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="42" y="642" font-size="14" font-weight="700" fill="#1b2733">03_language.parquet</text>
<text x="42" y="659.5" font-size="12" fill="#1b2733" xml:space="preserve">cột language, lang_score, lang_mix (JSON), lang_answer (SFT); song song qua</text>
<text x="42" y="676.0" font-size="12" fill="#1b2733" xml:space="preserve">CuratorBackend khi có --executor. Ngưỡng min_lang_score và mixed_language dùng ở</text>
<text x="42" y="692.5" font-size="12" fill="#1b2733" xml:space="preserve">stage quality.</text>
<polyline points="340.0,100.0 340.0,130.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,203.0 340.0,230.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,319.5 340.0,360.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,466.0 340.0,500.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="340.0,573.0 340.0,620.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="737" width="18" height="14" rx="3" fill="#eef2f7" stroke="#7a8aa0"/><text x="54" y="748" font-size="11.5" fill="#455566">đầu vào / dữ liệu</text>
<rect x="187" y="737" width="18" height="14" rx="3" fill="#e9f5ee" stroke="#3f9b6b"/><text x="211" y="748" font-size="11.5" fill="#455566">bước xử lý (CPU)</text>
<rect x="337" y="737" width="18" height="14" rx="3" fill="#fff4dc" stroke="#d19a1f"/><text x="361" y="748" font-size="11.5" fill="#455566">rẽ nhánh / điều kiện</text>
<rect x="513" y="737" width="18" height="14" rx="3" fill="#fdecea" stroke="#c94a3f"/><text x="537" y="748" font-size="11.5" fill="#455566">loại / dừng</text>
<rect x="632" y="737" width="18" height="14" rx="3" fill="#e3eefb" stroke="#2a78d6"/><text x="656" y="748" font-size="11.5" fill="#455566">đầu ra</text>
</svg>
