<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 605" width="1040" height="605" font-family="DejaVu Sans, Arial, sans-serif">
<title>Eval và chống nhiễm: giữ lại trước, quét theo từng câu, so cặp có khoảng tin cậy</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455566"/></marker></defs>
<rect width="1040" height="605" fill="#ffffff"/>
<text x="520.0" y="34.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2733" xml:space="preserve">Eval và chống nhiễm: giữ lại trước, quét theo từng câu, so cặp có khoảng tin cậy</text>
<text x="520.0" y="58.0" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e" xml:space="preserve">Nhóm giữ lại và danh sách benchmark phải chốt TRƯỚC khi sinh dữ liệu hay chia train</text>
<rect x="40" y="80" width="16" height="16" rx="3" fill="#eef2f7" stroke="#7a8aa0" stroke-width="1.5"/>
<text x="62.0" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã có, đã chạy</text>
<rect x="188.8" y="80" width="16" height="16" rx="3" fill="#e9f5ee" stroke="#3f9b6b" stroke-width="1.5"/>
<text x="210.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đã code, chưa đo trên server</text>
<rect x="438.4" y="80" width="16" height="16" rx="3" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="460.4" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">đề xuất mới</text>
<rect x="565.6" y="80" width="16" height="16" rx="3" fill="#fdf3dc" stroke="#c98a1a" stroke-width="1.5"/>
<text x="587.6" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">tuỳ chọn</text>
<rect x="671.2" y="80" width="16" height="16" rx="3" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="693.2" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cổng kiểm tra / đo</text>
<rect x="848.8000000000001" y="80" width="16" height="16" rx="3" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="870.8" y="93.0" text-anchor="start" font-size="12" font-weight="400" fill="#1b2733" xml:space="preserve">cần chốt</text>
<rect x="40" y="120" width="300" height="129" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="190.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Danh sách benchmark (K-01)</text>
<text x="190.0" y="159.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Theo dõi: BPB nội bộ, LAMBADA-vi, ViLLM-</text>
<text x="190.0" y="174.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Eval cloze</text>
<text x="190.0" y="189.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Kiến thức: VMLU, ViLLM-Eval, VNHSGE,</text>
<text x="190.0" y="204.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">SeaExam-vi, ViAdminShift</text>
<text x="190.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">Không tụt: IFEval + SEA-IFEval, GSM8K,</text>
<text x="190.0" y="234.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">HumanEval+ + MBPP+, SEA-MTBench</text>
<rect x="40" y="279" width="300" height="84" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="190.0" y="301.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">configs/benchmarks/ (đang rỗng)</text>
<text x="190.0" y="318.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">cả bản Việt lẫn bản gốc tiếng Anh nếu là</text>
<text x="190.0" y="333.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">bản dịch;</text>
<text x="190.0" y="348.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">kiểm giấy phép trước khi lưu</text>
<line x1="190.0" y1="249.0" x2="190.0" y2="279.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="370" y="120" width="300" height="129" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="520.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Nhóm giữ lại (K-02)</text>
<text x="520.0" y="159.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">H1 theo họ trùng: split_bucket 98–99 (có</text>
<text x="520.0" y="174.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">sẵn)</text>
<text x="520.0" y="189.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">H2 theo nhóm nguồn: cả cuốn / môn / tạp</text>
<text x="520.0" y="204.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">chí, năm VJOL mới nhất (~3–5%)</text>
<text x="520.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">H3 theo ngữ nghĩa: bỏ đoạn train có cosine</text>
<text x="520.0" y="234.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">≥ τ với H2</text>
<rect x="370" y="279" width="300" height="69" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="520.0" y="301.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Cột holdout_group (L-02)</text>
<text x="520.0" y="318.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">mọi mẫu sinh ra thừa hưởng nhóm của đoạn</text>
<text x="520.0" y="333.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">nguồn</text>
<line x1="520.0" y1="249.0" x2="520.0" y2="279.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="700" y="120" width="300" height="114" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="850.0" y="142.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Quét nhiễm theo từng câu (L-01)</text>
<text x="850.0" y="159.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">8-gram, câu bị đánh dấu khi &gt; 50% token</text>
<text x="850.0" y="174.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">trùng</text>
<text x="850.0" y="189.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">đoạn khớp dài nhất, NFC, gồm cả đáp án</text>
<text x="850.0" y="204.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">thêm vòng ngữ nghĩa khác ngôn ngữ (bắt bản</text>
<text x="850.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">dịch)</text>
<rect x="700" y="264" width="300" height="84" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="850.0" y="286.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Quét trên MỌI dữ liệu train</text>
<text x="850.0" y="303.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">CPT, replay, chỉ thị mở, KU SFT, dữ liệu</text>
<text x="850.0" y="318.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">sinh</text>
<text x="850.0" y="333.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">→ contamination_items.parquet</text>
<line x1="850.0" y1="234.0" x2="850.0" y2="264.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="190.0,363.0 190.0,385.0 685,385.0 685,177.0 700,177.0" fill="none" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="420.0" y="379.0" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e" xml:space="preserve">câu benchmark đưa vào bộ quét</text>
<rect x="700" y="378" width="300" height="69" rx="8" fill="#f1eafb" stroke="#7b4fc4" stroke-width="1.5"/>
<text x="850.0" y="400.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Chính sách khi nhiễm (K-01)</text>
<text x="850.0" y="417.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">gắn cờ / xoá đoạn train / báo điểm trên</text>
<text x="850.0" y="432.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">phần sạch</text>
<line x1="850.0" y1="348.0" x2="850.0" y2="378.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="497" width="960" height="84" rx="8" fill="#fbe9e7" stroke="#c4503f" stroke-width="1.5"/>
<text x="50.0" y="519.0" text-anchor="start" font-size="13" font-weight="700" fill="#1b2733" xml:space="preserve">Giao thức so sánh trước / sau</text>
<text x="50.0" y="536.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">1) cố định harness, prompt, số shot, template, CoT, nhiệt độ 0    2) base / CPT chấm cloze hoặc log-prob; instruct chấm sinh văn bản</text>
<text x="50.0" y="551.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">3) mốc: base, instruct gốc, mỗi ~100–200M token, sau chat vector, sau SFT    4) so cặp từng câu (McNemar / bootstrap), khoảng tin cậy 95%</text>
<text x="50.0" y="566.0" text-anchor="start" font-size="11" font-weight="400" fill="#1b2733" xml:space="preserve">5) báo cả điểm trên phần câu không nhiễm    6) cổng chỉ đỏ khi cận dưới của mức tụt vượt ngưỡng (K-16)</text>
<line x1="520.0" y1="457.0" x2="520.0" y2="497.0" stroke="#455566" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
