# Cấu hình dự án vi-corpus-etl, quản lý thư viện bằng uv (uv sync / uv run).
[project]
name = "vi-corpus-etl"
version = "0.1.0"
description = "ETL corpus tiếng Việt cho LLM từ nhiều nguồn: SEA (Hugging Face), Google Drive, VISTA/VJOL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=1.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[dependency-groups]
# chỉ cần khi phát triển / chạy test
dev = [
    "pytest>=8.0",
    "pyarrow>=15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
