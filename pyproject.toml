# Cấu hình dự án vi-corpus-etl, quản lý thư viện bằng uv (uv sync / uv run).
[project]
name = "vi-corpus-etl"
version = "0.1.0"
description = "ETL corpus tiếng Việt cho LLM từ nhiều nguồn: SEA (Hugging Face), sách stbook.vn, giáo trình (Google Drive), VISTA/VJOL"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.20",
    "fasttext-numpy2-wheel>=0.9.2",
    "huggingface_hub>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "requests>=2.31",
    "tokenizers>=0.23.2",
    "tqdm>=4.66",
    "trafilatura>=2.0.0",
]

[dependency-groups]
# chỉ cần khi phát triển / chạy test
dev = [
    "pytest>=8.0",
    "pyarrow>=15.0",
]
# OCR (sách stbook, trang scan trong giáo trình) và giữ GPU (gpu_keepalive dùng torch): uv sync --group ocr.
# setuptools<81 vì vietocr -> gdown cần pkg_resources.
ocr = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "setuptools<81",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "vietocr>=0.3.12",
]

# Chạy song song nhiều CPU / GPU bằng NeMo Curator + Ray (vi_corpus/pipeline/curator.py): uv sync --group curator.
# Trên server GPU thay "text_cpu" bằng "text_cuda12" (uv pip install "nemo-curator[text_cuda12]") như ViLA.
# transformers là bộ nhúng HF (vi_corpus/pipeline/embed.py).
curator = [
    "nemo-curator[text_cpu]>=0.7",
    "transformers>=4.40",
    "torch>=2.14.0",
]
# Bản đồ embedding (stage reduce + viz): PCA / UMAP / HDBSCAN và plotly (giống packages/reducer, packages/visualizer của ViLA).
# Muốn UMAP trên GPU thì tự cài cuML (RAPIDS), pipeline tự dùng nếu import được.
viz = [
    "pandas>=2.0",
    "plotly>=5.20",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.6",
]

# Group cài mặc định cho `uv sync` / `uv run` (không cần --group). `ocr` không nằm trong đây vì nặng (paddle, vietocr):
# cần OCR thì thêm `--group ocr`.
[tool.uv]
default-groups = ["dev", "curator", "viz"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
